name: 市场检查
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 签名与包回归
        run: node --test scripts/*.test.mjs
      - uses: ./.github/actions/host-tool
        with:
          ref: ${{ vars.STARTER_HOST_REF || 'develop' }}
      - name: 编译全部插件、真实 Wasm 回归与离线验签
        env:
          MARKET_REVISION: 1
        run: node scripts/check.mjs
