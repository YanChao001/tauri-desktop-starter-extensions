name: 市场检查
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: market-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: 脚本与插件界面回归
        run: node --test scripts/*.test.mjs plugins/*/ui/*.test.mjs
      - uses: ./.github/actions/plugin-check
      - uses: ./.github/actions/host-tool
        with:
          ref: ${{ vars.STARTER_HOST_REF || 'develop' }}
      - name: 编译全部插件、真实 Wasm 回归与离线验签
        env:
          MARKET_REVISION: 1
        run: node scripts/check.mjs
