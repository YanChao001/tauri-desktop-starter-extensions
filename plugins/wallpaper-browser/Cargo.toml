[package]
name = "starter-extism-wallpaper-browser"
version = "1.2.3"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
extism-pdk = "=1.4.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"

[profile.release]
opt-level = "s"
lto = true
strip = true
