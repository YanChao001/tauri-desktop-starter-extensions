<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>壁纸库</title>
    <style>
      body {
        padding: 0;
      }
      main {
        max-width: 1240px;
        margin: auto;
        padding: clamp(16px, 3vw, 28px);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1.5rem;
        letter-spacing: -0.04em;
        line-height: 1.2;
      }
      h2 {
        font-size: 1rem;
      }
      header,
      .toolbar,
      .gallery-controls,
      .gallery-actions,
      .inline-field,
      .source-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      header {
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }
      .intro {
        margin-top: 8px;
        color: var(--muted-foreground);
        font-size: 0.875rem;
        line-height: 1.6;
      }
      .muted {
        color: var(--muted-foreground);
        font-size: 0.8125rem;
      }
      .toolbar {
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .gallery-controls,
      .gallery-actions {
        flex-wrap: wrap;
      }
      .gallery-actions > button,
      header > button,
      #search {
        flex: none;
        white-space: nowrap;
      }
      .inline-field > span {
        flex: none;
        white-space: nowrap;
        font-size: 0.8125rem;
        color: var(--muted-foreground);
      }
      .inline-field > select {
        width: auto;
        min-width: 0;
      }
      .library-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 16px;
      }
      .tabs {
        display: inline-flex;
        gap: 20px;
        min-width: 0;
      }
      .tabs button {
        position: relative;
        border: 0;
        border-radius: 0;
        background: transparent;
        height: 2rem;
        padding: 0 2px;
        color: var(--muted-foreground);
      }
      .tabs button::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        background: var(--primary);
        transform: scaleX(0);
        transition: transform 0.2s ease;
      }
      .tabs button[aria-selected="true"] {
        color: var(--foreground);
      }
      .tabs button[aria-selected="true"]::after {
        transform: scaleX(1);
      }
      .tabs button:hover {
        color: var(--foreground);
      }
      .library-bar > button {
        flex: none;
      }
      .collection-group {
        margin: 0;
      }
      .source-toolbar {
        display: flex;
        justify-content: flex-start;
        gap: 8px;
        flex-wrap: wrap;
        padding: 0;
      }
      .filter-field {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      #category {
        width: 9rem;
      }
      .query-controls {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 18rem;
        max-width: 32rem;
        min-width: min(100%, 12rem);
      }
      .query-field {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      .query-field svg {
        position: absolute;
        left: 0.65rem;
        top: 50%;
        transform: translateY(-50%);
        width: 0.875rem;
        height: 0.875rem;
        pointer-events: none;
        color: var(--muted-foreground);
      }
      #query {
        padding-left: 2rem;
      }
      .local-toolbar {
        justify-content: flex-start;
        gap: 16px;
      }
      .local-toolbar #local-summary {
        flex: none;
      }
      .local-toolbar .gallery-controls {
        gap: 8px;
      }
      .source-row {
        position: relative;
        flex: none;
        gap: 6px;
        max-width: 100%;
        flex-wrap: nowrap;
      }
      #provider {
        width: 12rem;
      }
      button.help-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.5rem;
        height: 1.5rem;
        min-height: 1.5rem;
        flex: 0 0 1.5rem;
        padding: 0;
        border: 0;
        background: transparent;
        border-radius: calc(var(--radius, 0.625rem) * 0.8);
        color: var(--muted-foreground);
      }
      .help-trigger svg {
        width: 0.875rem;
        height: 0.875rem;
        flex: none;
      }
      button.help-trigger:hover {
        background: var(--starter-ghost-hover, var(--muted));
      }
      .help {
        position: static;
        display: inline-flex;
        flex: none;
      }
      .help-text {
        display: none;
        position: absolute;
        z-index: 10;
        top: calc(100% + 8px);
        left: 0;
        width: min(18rem, calc(100vw - 40px));
        max-height: 18rem;
        overflow: auto;
        padding: 0.65rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius, 0.625rem) * 0.8);
        background: var(--popover, var(--card));
        color: var(--popover-foreground, var(--foreground));
        font-size: 0.75rem;
        line-height: 1.65;
        white-space: normal;
        box-shadow: 0 4px 12px #0002;
      }
      .help::after {
        content: "";
        position: absolute;
        left: 0;
        top: 100%;
        width: min(18rem, calc(100vw - 40px));
        height: 10px;
      }
      .help:not([data-dismissed]):hover .help-text,
      .help:not([data-dismissed]):focus-within .help-text {
        display: block;
      }
      .collection-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 2rem;
      }
      #result-summary,
      #local-summary {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .collection-mark {
        color: var(--muted-foreground);
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        flex: none;
      }
      .results,
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 10rem), 1fr));
        gap: 12px;
      }
      button.result {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: start;
        gap: 0;
        width: 100%;
        height: auto;
        min-width: 0;
        padding: 0;
        overflow: hidden;
        text-align: left;
        white-space: normal;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius, 0.625rem) * 1.2);
        background: var(--surface-card, var(--card));
        color: var(--foreground);
        transition:
          transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1),
          border-color 0.2s,
          box-shadow 0.24s;
      }
      .result:hover,
      .result:focus-visible {
        border-color: var(--primary);
        transform: translateY(-3px);
        box-shadow: 0 8px 24px #0001;
      }
      .result[aria-pressed="true"] {
        border-color: var(--primary);
      }
      .result-media {
        display: grid;
        place-items: center;
        width: 100%;
        aspect-ratio: 16/10;
        overflow: hidden;
        position: relative;
        background: var(--muted);
      }
      .result-media img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition:
          transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 0.3s;
      }
      .result:hover img,
      .result:focus-visible img {
        transform: scale(1.045);
      }
      .result-copy {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 4px;
        padding: 10px 12px;
        min-width: 0;
      }
      .result strong {
        font-size: 0.875rem;
        font-weight: 550;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        line-height: 1.35;
      }
      .result-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.75rem;
        line-height: 1.35;
        color: var(--muted-foreground);
      }
      .result-meta > span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .result-meta > span:last-child {
        flex: none;
        white-space: nowrap;
      }
      .image-state {
        display: grid;
        justify-items: center;
        align-content: center;
        gap: 8px;
        width: 100%;
        height: 100%;
        padding: 12px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted-foreground);
      }
      .image-state svg {
        width: 1.5rem;
        height: 1.5rem;
        opacity: 0.6;
      }
      .result-media[data-state="loading"]::after,
      .result-media[data-state="idle"]::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          110deg,
          transparent 25%,
          color-mix(in oklab, var(--foreground) 5%, transparent) 48%,
          transparent 70%
        );
        transform: translateX(-100%);
        animation: sweep 1.8s ease-in-out infinite;
      }
      .result[data-onscreen="false"] .result-media::after {
        animation-play-state: paused;
      }
      .result.fresh {
        animation: card-enter 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
        animation-delay: var(--entry-delay, 0ms);
      }
      .empty-state {
        grid-column: 1/-1;
        display: grid;
        justify-items: center;
        gap: 12px;
        padding: 32px 16px;
        border: 1px dashed var(--border);
        border-radius: calc(var(--radius, 0.625rem) * 1.2);
        color: var(--muted-foreground);
        text-align: center;
        font-size: 0.875rem;
      }
      .empty-state svg {
        width: 2rem;
        height: 2rem;
      }
      .preview-head {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: none;
        padding: 8px 12px;
      }
      .preview-head h2 {
        flex: 1;
        min-width: 0;
        margin-right: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.875rem;
        line-height: 1.35;
      }
      .preview-head button {
        flex: none;
        width: 2rem;
        height: 2rem;
        padding: 0;
      }
      .preview-head svg,
      .preview-actions svg {
        width: 1rem;
        height: 1rem;
        flex: none;
      }
      .preview {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }
      .preview-stage {
        position: relative;
        display: grid;
        place-items: center;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: var(--muted);
      }
      .preview-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 0;
        object-fit: contain;
        display: block;
      }
      .placeholder {
        display: grid;
        place-items: center;
        aspect-ratio: 16/9;
        background: var(--muted);
        border-radius: var(--radius, 0.625rem);
        padding: 24px;
        text-align: center;
        color: var(--muted-foreground);
        font-size: 0.875rem;
      }
      .preview-stage > .placeholder {
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
        border-radius: 0;
        padding-bottom: 56px;
      }
      #retry-preview {
        position: absolute;
        bottom: 12px;
        max-width: calc(100% - 24px);
      }
      .metadata {
        display: grid;
        gap: 12px;
        padding: 12px 16px 16px;
        min-height: 0;
        max-height: min(24rem, calc(100dvh - 112px));
        overflow: auto;
        overflow-wrap: anywhere;
        font-size: 0.8125rem;
        line-height: 1.6;
      }
      .preview-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        flex: none;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--border);
      }
      .preview-actions > button {
        flex: none;
        width: auto;
        max-width: none;
        height: 2rem;
        padding: 0 0.625rem;
        white-space: nowrap;
        border-radius: calc(var(--radius, 0.625rem) * 0.8);
      }
      .preview-actions .action-label {
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .gallery {
        margin-top: 16px;
      }
      .card {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius, 0.625rem) * 1.2);
        overflow: hidden;
        background: var(--surface-card, var(--card));
      }
      button.card-image {
        position: relative;
        display: block;
        width: 100%;
        height: auto;
        min-height: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: var(--muted);
      }
      button.card-image:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: -3px;
      }
      .card img {
        width: 100%;
        aspect-ratio: 16/10;
        object-fit: cover;
        background: var(--muted);
        display: block;
      }
      .card-check {
        position: absolute;
        top: 8px;
        right: 8px;
        display: grid;
        place-items: center;
        width: 1.5rem;
        height: 1.5rem;
        border-radius: 50%;
        background: var(--primary);
        color: var(--primary-foreground);
        pointer-events: none;
      }
      .card-check svg {
        width: 0.875rem;
        height: 0.875rem;
        stroke-width: 2;
      }
      .card-heading {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 8px;
        min-width: 0;
      }
      .card h2 {
        flex: 1;
        min-width: 0;
        font-size: 0.75rem;
        font-weight: 500;
        margin: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        line-height: 1.5;
      }
      .card.active {
        border-color: var(--primary);
      }
      .card-icon-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 1.75rem;
        height: 1.75rem;
        min-height: 1.75rem;
        padding: 0;
        border: 0;
        border-radius: calc(var(--radius, 0.625rem) * 0.8);
        background: transparent;
        color: var(--foreground);
        flex: none;
      }
      .card-icon-button svg {
        width: 0.875rem;
        height: 0.875rem;
      }
      .card-icon-button:hover,
      .card-icon-button:focus-visible {
        background: var(--accent);
        color: var(--accent-foreground);
      }
      .card-icon-button[data-action="remove"] {
        color: var(--destructive);
        background: color-mix(in oklab, var(--destructive) 8%, transparent);
      }
      .card-icon-button[data-action="remove"]:hover,
      .card-icon-button[data-action="remove"]:focus-visible {
        background: color-mix(in oklab, var(--destructive) 16%, transparent);
      }
      #permission {
        margin-bottom: 12px;
        line-height: 1.6;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      dialog {
        width: min(430px, calc(100vw - 32px));
        max-width: calc(100vw - 32px);
        max-height: calc(100dvh - 32px);
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius, 0.625rem) * 1.2);
        padding: 22px;
        background: var(--card);
        color: var(--foreground);
      }
      dialog::backdrop {
        background: #0008;
      }
      dialog[open] {
        animation: dialog-enter 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      #preview-dialog {
        width: min(900px, calc(100vw - 32px));
        height: min(80dvh, 640px);
        padding: 0;
        overflow: hidden;
      }
      #image-info-dialog {
        width: min(440px, calc(100vw - 32px));
        padding: 0;
        overflow: hidden;
      }
      #preview-dialog[open],
      #image-info-dialog[open] {
        display: flex;
        flex-direction: column;
      }
      dialog label {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      #dialog-description {
        margin-top: 10px;
        line-height: 1.6;
      }
      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes dialog-enter {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sweep {
        to {
          transform: translateX(100%);
        }
      }
      html[data-gallery-visible="false"] *,
      html[data-gallery-visible="false"] *::after {
        animation-play-state: paused !important;
      }
      html[data-motion="reduced"] *,
      html[data-motion="reduced"] *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
      html[data-motion="reduced"] .result:hover,
      html[data-motion="reduced"] .result:focus-visible,
      html[data-motion="reduced"] .result img {
        transform: none;
      }
      @media (max-width: 520px) {
        header {
          align-items: start;
        }
        header > button {
          padding-inline: 10px;
        }
        .source-toolbar {
          align-items: stretch;
        }
        .query-controls {
          flex-basis: 100%;
          max-width: none;
        }
        #category {
          width: 8rem;
        }
        .tabs {
          gap: 14px;
        }
        .library-bar {
          gap: 8px;
        }
        #provider {
          width: 10rem;
        }
        .result-copy {
          padding: 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
        .result:hover,
        .result:focus-visible,
        .result:hover img,
        .result:focus-visible img,
        .result img {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="title">壁纸库</h1>
        </div>
      </header>
      <p id="permission" class="muted" role="status" hidden></p>
      <div class="library-bar">
        <div
          class="tabs"
          data-slot="tabs-list"
          data-variant="line"
          role="tablist"
          aria-label="Wallpaper collections"
        >
          <button
            id="remote-tab"
            type="button"
            role="tab"
            data-slot="tabs-trigger"
            aria-controls="remote-panel"
            aria-selected="true"
            data-variant="ghost"
          ></button>
          <button
            id="local-tab"
            type="button"
            role="tab"
            data-slot="tabs-trigger"
            aria-controls="local-panel"
            aria-selected="false"
            tabindex="-1"
            data-variant="ghost"
          ></button>
        </div>
        <button id="settings" type="button" data-variant="ghost"></button>
      </div>
      <section id="remote-panel" role="tabpanel" aria-labelledby="remote-tab">
        <fieldset class="collection-group">
          <legend id="remote-legend"></legend>
          <form id="search-form" class="source-toolbar" role="search">
            <div class="source-row">
              <label id="source-name" class="sr-only" for="provider"></label>
              <select id="provider" aria-describedby="source-note">
                <option value="upx8">UPX8</option>
                <option value="wallhaven">Wallhaven</option>
                <option value="commons">Wikimedia Commons</option>
                <option value="nekosbest">Nekos.best</option>
              </select>
              <span class="help">
                <button
                  id="source-help-button"
                  class="help-trigger"
                  type="button"
                  aria-describedby="source-note"
                  data-variant="ghost"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="14"
                    height="14"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 16v-4M12 8h.01" />
                  </svg>
                </button>
                <span id="source-note" class="help-text" role="tooltip"></span>
              </span>
            </div>
            <label class="filter-field" id="category-field"
              ><span id="category-label" class="sr-only"></span
              ><select id="category" aria-labelledby="category-label"></select
            ></label>
            <div class="query-controls">
              <label class="query-field"
                ><span id="query-label" class="sr-only"></span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  aria-hidden="true"
                >
                  <circle cx="10.5" cy="10.5" r="6.5" />
                  <path d="m16 16 4 4" /></svg
                ><input
                  id="query"
                  maxlength="100"
                  aria-labelledby="query-label"
                  autocomplete="off"
              /></label>
              <button id="search" type="button" class="primary"></button>
            </div>
          </form>
          <div class="collection-heading">
            <p id="result-summary" class="muted" aria-live="polite"></p>
            <button
              id="retry-failed"
              type="button"
              data-variant="ghost"
              hidden
            ></button>
          </div>
          <div id="results" class="results"></div>
        </fieldset>
      </section>
      <dialog id="preview-dialog" aria-labelledby="preview-title">
        <div class="preview-head">
          <h2 id="preview-title"></h2>
          <button
            id="preview-info"
            type="button"
            data-variant="ghost"
            aria-haspopup="dialog"
            aria-controls="image-info-dialog"
          >
            <svg

    <script>

            ["game", "游戏", "Games"],

            ["city", "城市", "Cities"],
            ["abstract", "抽象", "Abstract"],
            ["space", "星空", "Space"],
            ["car", "汽车", "Cars"],
            ["girl", "人物", "People"],
            ["sport", "运动", "Sports"],

          wallhaven: [
            ["all", "全部分类", "All categories"],
            ["general", "综合", "General"],
            ["anime", "动漫", "Anime"],
            ["people", "人物", "People"],
          ],
          commons: [
            ["all", "推荐风景", "Featured landscapes"],
            ["landscape", "风景", "Landscape"],
            ["mountain", "山川", "Mountains"],
            ["ocean", "海洋", "Ocean"],
            ["forest", "森林", "Forest"],
            ["city", "城市", "Cities"],
            ["space", "星空", "Space"],
          ],
          nekosbest: [
            ["neko", "猫娘", "Neko"],
            ["kitsune", "狐娘", "Kitsune"],
            ["waifu", "动漫女生", "Waifu"],
            ["husbando", "动漫男生", "Husbando"],

        const validQuery = (value) =>

          Array.from(value).length <= 100 &&

            provider === "commons"

            provider === "nekosbest"

            provider === "nekosbest"

          $("category").disabled =

            !granted("network:https") ||
            (provider === "upx8" && Boolean($("query").value.trim()));
          $("query").disabled = !granted("network:https");
          $("search").textContent = loadingCollection
            ? tr("载入中…", "Loading…")
            : $("query").value.trim()

              : tr("换一批", "Refresh");
        }
        function requestedFilters() {
          const provider = $("provider").value;
          const query = $("query").value.trim();

            provider,
            query,
            category:
              provider === "upx8" && query ? "all" : $("category").value,
          };
        }

          imageInFlight = 0,
          collectionEpoch = 0;

                "The image, name or source is unavailable. Please retry.",
              );

                "设置已在其他窗口改变，请刷新图库后重试。",

                    "The operation timed out. Try again shortly.",

                "The wallpaper service is busy. Try again shortly.",

                    "操作失败，请重试。",
                    "The operation failed. Please retry.",

          action,
          primary = false,
          actionName = "",
          capability = "wallpapers:manage",

          const element = text("button", label);
          element.type = "button";
          if (actionName) {
            element.dataset.action = actionName;
            if (
              ["add-to-gallery", "download-original", "open-source"].includes(
                actionName,
              )

              element.id = actionName;
          }

          else element.dataset.variant = "outline";

          return element;
        }
        function isObject(value) {
          return (
            value !== null && typeof value === "object" && !Array.isArray(value)

        }
        function validText(value, limit) {
          return (
            Boolean(value.trim()) &&
            Array.from(value).length <= limit &&
            !/[\u0000-\u001f\u007f-\u009f]/.test(value)

        }

            typeof value === "string" &&
            value.length <= 2 * 1024 * 1024 &&

        }
        function isImage(value) {

            isObject(value) &&
            typeof value.resultId === "string" &&
            /^[a-f0-9]{16}$/.test(value.resultId) &&
            typeof value.title === "string" &&
            validText(value.title, 120) &&
            ["originalUrl", "previewUrl", "sourceUrl"].every(
              (key) =>
                typeof value[key] === "string" &&
                value[key].length <= 4096 &&
                /^https:\/\//.test(value[key]),

                Number.isSafeInteger(value[key]) &&
                value[key] >= 0 &&
                value[key] <= 30000,

        function isLibrary(value) {

            isObject(value) &&
            Number.isInteger(value.revision) &&
            value.revision >= 0 &&
            value.revision <= 2147483647 &&
            Number.isSafeInteger(value.limit) &&
            value.limit > 0 &&
            Array.isArray(value.items) &&
            value.items.length <= value.limit &&
            new Set(value.items.map((item) => item?.id)).size ===
              value.items.length &&
            value.items.every(
              (item) =>
                isObject(item) &&
                /^[a-fA-F0-9]{64}$/.test(item.id) &&
                typeof item.name === "string" &&
                item.name.length <= 1024 &&
                typeof item.active === "boolean" &&
                (item.dataUrl === null || isImageData(item.dataUrl)),

        }
        function validResponse(action, response) {
          if (!isObject(response)) return false;
          switch (action) {
            case "list":
            case "apply":
            case "rename":
            case "remove":
              return isLibrary(response);
            case "import-resource":
              return isLibrary(response.library);
            case "import":

              return response.opened === true;

        }

            action,
            ...extra,

            throw { code: "EXTENSION_UNAVAILABLE" };
          if (!validResponse(action, response))
            throw { code: "EXTENSION_RUN_FAILED" };

            throw { code: "EXTENSION_UNAVAILABLE" };

            action: "fetch-image",
            url,

                resource.mime,

              resource.bytes <= 0 ||
              resource.bytes > 16 * 1024 * 1024 ||
              !Number.isSafeInteger(resource.width) ||
              !Number.isSafeInteger(resource.height) ||
              resource.width <= 0 ||
              resource.height <= 0 ||
              resource.width > 8192 ||
              resource.height > 8192 ||

            return;

          if (source === ignoredResultsState) return;

            state = JSON.parse(source);

            return;

            !isObject(state) ||
            state.schema !== 3 ||
            !Array.isArray(state.items) ||
            state.items.length > 24 ||
            !state.items.every(isImage) ||
            new Set(state.items.map((item) => item.resultId)).size !==
              state.items.length ||
            !Object.hasOwn(providers, state.provider) ||
            !validQuery(state.query) ||
            !categories[state.provider].some(
              (item) => item[0] === state.category,

            state.provider,
            state.query,
            state.category,
            state.items,

          entriesQuery = state.query;
          entriesCategory = state.category;

              entries.find((item) => item.resultId === selected.resultId) ||

        }
        function focusTarget() {

          return () =>
            id
              ? $(id)
              : resultId
                ? Array.from(document.querySelectorAll(".result")).find(
                    (element) => element.dataset.resultId === resultId,
                  )

            granted("network:https")

            query: $("query").value,

                await starter.checkpoint(JSON.parse(value), false);
              } catch (error) {

            message(
              tr(

                "The interface draft was not saved. Try again shortly.",

            );

          }

            !Object.hasOwn(providers, filters.provider) ||
            !granted("network:https")

            message(
              tr(
                "关键词最多 100 个字符，且不能包含控制字符。",
                "Use up to 100 characters without control characters.",
              ),
              true,
            );

            const view = await starter.run("load", filters);

                  "图源暂未返回图片，请换一批或切换图源。",

              item,
              "rename",
              tr("重命名", "Rename"),
              async () => {
                const name = await confirm("rename", item);
                if (name)
                  library = await request("rename", { id: item.id, name });
              },
            );
            rename.className = "card-icon-button";
            rename.append(
              icon("m16 3 5 5M4 20l4-1L21 6a2.12 2.12 0 0 0-3-3L5 16Z"),
            );
            const remove = wallpaperButton(
              item,
              "remove",
              tr("移除", "Remove"),
              async () => {
                if (await confirm("remove", item))
                  library = await request("remove", {
                    id: item.id,
                    expectedRevision: library.revision,
                  });
              },
            );
            remove.className = "card-icon-button";
            remove.append(
              icon("M3 6h18M9 6V4h6v2M5 6l1 14h12l1-14M10 10v6M14 10v6"),
            );
            const heading = text("div", "", "card-heading");
            heading.append(text("h2", item.name), rename, remove);
            card.append(apply, heading);
            $("gallery").append(card);
          }
          if (!library.items.length)
            $("gallery").append(
              text(
                "p",
                libraryLoaded
                  ? tr("暂无图片", "No images yet")
                  : tr(
                      "点击刷新载入本机图库。",
                      "Refresh to load the local gallery.",
                    ),
                "muted",
              ),
            );
          restoreFocus(returnFocus);
        }
        $("search").onclick = () => void work(loadCollection);
        $("provider").onchange = () => {
          configureFilters(true);
          checkpointNavigation(true);
          void work(loadCollection);
        };
        $("category").onchange = () => {
          checkpointNavigation(true);
          void work(loadCollection);
        };
        $("query").oninput = () => {
          configureFilters();
          checkpointNavigation();
        };
        $("search-form").onsubmit = (event) => {
          event.preventDefault();
        };
        $("query").onkeydown = (event) => {
          if (event.key === "Enter" && !event.isComposing) {
            event.preventDefault();
            if (!event.repeat) void work(loadCollection);
          }
        };
        $("retry-failed").onclick = () => {
          if (!canLoadImages()) return;
          batchErrorNotified = "";
          for (const record of thumbnails.values())
            if (record.status === "error") record.status = "idle";
          for (const item of entries) updateThumbnail(item);
          updateRetryControl();
          pumpThumbnails();
        };
        $("preview-close").onclick = closePreview;
        $("preview-info").onclick = () => {
          if (selected && allowed() && !$("image-info-dialog").open) {
            $("image-info-dialog").showModal();
            $("image-info-close").focus();
          }
        };
        $("image-info-close").onclick = () => $("image-info-dialog").close();
        $("image-info-dialog").onclose = () =>
          restoreFocus(() =>
            $("preview-dialog").open && allowed() && visible()
              ? $("preview-info")
              : null,
          );
        $("preview-dialog").onclose = () => {
          if ($("image-info-dialog").open) $("image-info-dialog").close();
          const result = Array.from($("results").children).find(
            (node) => node.dataset.resultId === selected?.resultId,
          );
          result?.focus({ preventScroll: true });
        };
        $("refresh").onclick = () => void work(refresh);
        $("fit").onchange = () => checkpointNavigation(true);
        $("settings").onclick = () => void work(() => request("open-settings"));
        $("import").onclick = () =>
          void work(async () => {
            const response = await request("import");
            if (response.cancelled)
              message(tr("已取消导入。", "Import cancelled."));
            else {
              library = response.library;
              libraryLoaded = true;
              message(
                tr("图片已加入本机图库。", "Image added to the local gallery."),
              );
            }
          });
        for (const name of ["remote", "local"]) {
          $(name + "-tab").onclick = () => {
            tab = name;
            render();
            checkpointNavigation(true);
            if (name === "local") {
              if (busy) refreshPending = true;
              else void work(refresh);
            }
            initializeContent();
          };
          $(name + "-tab").onkeydown = (event) => {
            if (
              ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)
            ) {
              event.preventDefault();
              const next =
                event.key === "Home"
                  ? "remote"
                  : event.key === "End"
                    ? "local"
                    : name === "remote"
                      ? "local"
                      : "remote";
              $(next + "-tab").click();
              $(next + "-tab").focus();
            }
          };
        }
        const sourceHelp = $("source-help-button").closest(".help");
        for (const name of ["pointerenter", "focusin"])
          sourceHelp.addEventListener(
            name,
            () => delete sourceHelp.dataset.dismissed,
          );
        for (const name of ["pointerleave", "focusout"])
          sourceHelp.addEventListener(name, () => {
            if (!sourceHelp.contains(document.activeElement))
              delete sourceHelp.dataset.dismissed;
          });
        document.addEventListener("keydown", (event) => {
          if (
            event.key === "Escape" &&
            !$("confirm-dialog").open &&
            (sourceHelp.matches(":hover") ||
              sourceHelp.contains(document.activeElement))
          ) {
            sourceHelp.dataset.dismissed = "true";
            event.preventDefault();
          }
        });
        starter.onChange((next) => {
          const wasAllowed = allowed();
          const previousGrants = (snapshot?.grantedPermissions || [])
            .slice()
            .sort()
            .join(",");
          snapshot = next;
          if (
            previousGrants !==
            (next.grantedPermissions || []).slice().sort().join(",")
          )
            accessEpoch++;
          if (wasAllowed && !allowed()) {
            entries = [];
            entriesProvider = "";
            entriesQuery = "";
            entriesCategory = "";
            thumbnails.clear();
            collectionEpoch++;
            lastResultsState = "";
            cardsKey = "";
            loadingCollection = false;
            selected = null;
            preview = null;
            library = { revision: 0, items: [], limit: 0 };
            libraryLoaded = false;
            refreshPending = false;
            if ($("confirm-dialog").open) $("confirm-dialog").close("no");
          } else if (!granted("network:images")) {
            preview = null;
            thumbnails.clear();
            for (const item of entries)
              thumbnails.set(item.resultId, {
                url: item.previewUrl,
                status: "idle",
                dataUrl: null,
              });
            cardsKey = "";
          }
          if (!allowed()) closePreview();
          if (allowed()) readResults(next);
          render();
          if (wasAllowed && !allowed())
            message($("permission").textContent, true);
          if (initialized && !wasAllowed && allowed()) {
            initializePending = true;
            collectionAttempted = false;
          }
          initializeContent();
          if (!snapshot.busy && visible()) void flushCheckpoint();
        });
        document.addEventListener("visibilitychange", () => {
          document.documentElement.dataset.galleryVisible = String(visible());
          pumpThumbnails();
          initializeContent();
          if (visible()) void flushCheckpoint();
        });
        window.addEventListener("pagehide", () => {
          cardObserver?.disconnect();
        });
        void starter.ready
          .then(async (next) => {
            snapshot = next;
            const saved = next.checkpoint;
            const provider = saved?.provider ?? next.fields?.provider;
            if (Object.hasOwn(providers, provider))
              $("provider").value = provider;
            configureFilters();
            const query = saved?.query ?? next.fields?.query ?? "";
            if (validQuery(query)) $("query").value = query;
            const category = saved?.category ?? next.fields?.category;
            if (
              categories[$("provider").value].some(
                (item) => item[0] === category,
              )
            )
              $("category").value = category;
            if (saved && ["cover", "contain"].includes(saved.fit))
              $("fit").value = saved.fit;
            if (saved && ["remote", "local"].includes(saved.tab))
              tab = saved.tab;
            if (allowed()) readResults(next);
            initialized = true;
            render();
            if (allowed()) initializeContent();
            else message($("permission").textContent, true);
          })
          .catch((error) => message(failure(error), true));
      })();
    </script>
  </body>
</html>
