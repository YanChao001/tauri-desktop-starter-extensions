<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>壁纸库</title>
    <style>
      body {
        padding: 0;
      }
      main {
        max-width: 1240px;
        margin: auto;
        padding: 20px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 28px;
        letter-spacing: -0.035em;
      }
      h2 {
        font-size: 18px;
      }
      header,
      .toolbar,
      .gallery-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .gallery-controls {
        justify-content: flex-start;
        min-width: 0;
        max-width: 100%;
      }
      .gallery-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: none;
        max-width: 100%;
        flex-wrap: wrap;
      }
      .gallery-actions > button,
      .search > button {
        flex: none;
        white-space: nowrap;
      }
      .inline-field {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: 100%;
      }
      .inline-field > span {
        flex: none;
        white-space: nowrap;
      }
      .inline-field > select {
        width: auto;
        min-width: 0;
      }
      header {
        margin-bottom: 22px;
      }
      .muted {
        color: var(--muted-foreground);
        font-size: 13px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 12px;
        margin-bottom: 18px;
      }
      .tabs button[aria-selected="true"] {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      .search input {
        flex: 1;
        width: auto;
        min-width: 160px;
      }
      .search select {
        max-width: 100%;
      }
      #search {
        min-width: 6.5rem;
      }
      .source-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .source-row .help {
        position: static;
      }
      .help {
        position: relative;
        display: inline-flex;
      }
      button.help-trigger {
        width: 1.6rem;
        min-height: 1.6rem;
        padding: 0;
        border-radius: 50%;
        color: var(--muted-foreground);
      }
      .help-text {
        display: none;
        position: absolute;
        z-index: 10;
        top: 100%;
        left: 0;
        width: min(22rem, calc(100vw - 3rem));
        max-height: 60vh;
        overflow: auto;
        padding: 0.65rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: var(--radius, 0.625rem);
        background: var(--popover, var(--card));
        color: var(--popover-foreground, var(--foreground));
        font-size: 0.8rem;
        line-height: 1.5;
        white-space: normal;
        box-shadow: 0 4px 12px #0002;
      }
      .help:not([data-dismissed]):hover .help-text,
      .help:not([data-dismissed]):focus-within .help-text {
        display: block;
      }
      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(280px, 1.15fr);
        gap: 20px;
        align-items: start;
      }
      .results {
        display: grid;
        gap: 8px;
        padding: 3px;
      }
      .result {
        text-align: left;
        width: 100%;
        min-width: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        justify-content: stretch;
        justify-items: start;
        gap: 4px;
        white-space: normal;
        height: 5rem;
        grid-template-rows: 2.5em 1.25rem;
        align-content: center;
        line-height: 1.25;
      }
      .result[aria-pressed="true"] {
        border-color: var(--primary);
        background: color-mix(in oklab, var(--primary) 8%, var(--card));
      }
      .result strong {
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      .result .muted {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #result-summary,
      #local-summary {
        height: 1.5em;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .preview {
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--card);
        position: sticky;
        top: 12px;
      }
      .preview-image {
        width: 100%;
        aspect-ratio: 16/10;
        object-fit: contain;
        background: var(--muted);
        border-radius: 9px;
        display: block;
        margin-bottom: 14px;
      }
      .placeholder {
        display: grid;
        place-items: center;
        aspect-ratio: 16/10;
        background: var(--muted);
        border-radius: 9px;
        padding: 25px;
        text-align: center;
        color: var(--muted-foreground);
      }
      .preview h2 {
        overflow-wrap: anywhere;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        height: 2.5em;
        line-height: 1.25;
      }
      .metadata {
        display: grid;
        gap: 5px;
        margin-top: 8px;
        height: 8rem;
        align-content: start;
        overflow: auto;
        font-size: 13px;
        overflow-wrap: anywhere;
      }
      .image-details {
        margin-top: 8px;
        font-size: 0.8rem;
      }
      .image-details summary {
        cursor: pointer;
        color: var(--muted-foreground);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 13px;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr));
        gap: 14px;
        margin-top: 16px;
      }
      .card {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px;
        background: var(--card);
      }
      .card img {
        width: 100%;
        aspect-ratio: 16/10;
        object-fit: cover;
        border-radius: 7px;
        background: var(--muted);
      }
      .card h2 {
        font-size: 15px;
        overflow-wrap: anywhere;
        margin: 8px 0;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        height: 2.5em;
        line-height: 1.25;
      }
      .card.active {
        border-color: var(--primary);
      }
      .card .actions {
        gap: 5px;
      }
      .card-status {
        height: 1.5em;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      [hidden] {
        display: none !important;
      }
      dialog {
        max-width: min(430px, calc(100vw - 32px));
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px;
        background: var(--card);
        color: var(--foreground);
      }
      dialog::backdrop {
        background: color-mix(in oklab, var(--foreground) 25%, transparent);
      }
      dialog label {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      @media (max-width: 680px) {
        main {
          padding: 12px;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .preview {
          position: static;
        }
        .gallery {
          grid-template-columns: repeat(
            auto-fill,
            minmax(min(100%, 170px), 1fr)
          );
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 id="title">壁纸库</h1>
        </div>
        <button id="settings" type="button" data-variant="outline"></button>
      </header>
      <p id="permission" class="muted" role="status" hidden></p>
      <div class="tabs" role="tablist" aria-label="Wallpaper collections">
        <button
          id="remote-tab"
          type="button"
          role="tab"
          aria-controls="remote-panel"
          aria-selected="true"
          data-variant="outline"
        ></button>
        <button
          id="local-tab"
          type="button"
          role="tab"
          aria-controls="local-panel"
          aria-selected="false"
          tabindex="-1"
          data-variant="outline"
        ></button>
      </div>
      <section id="remote-panel" role="tabpanel" aria-labelledby="remote-tab">
        <div class="source-row">
          <span class="muted" id="source-name"></span>
          <span class="help">
            <button
              id="source-help-button"
              class="help-trigger"
              type="button"
              aria-describedby="source-note"
              data-variant="outline"
            >
              ?
            </button>
            <span id="source-note" class="help-text" role="tooltip"></span>
          </span>
        </div>
        <form id="search-form" class="search">
          <input
            id="query"
            maxlength="100"
            value="landscape"
            aria-label="搜索必应图片"
          />
          <label class="inline-field"
            ><span id="network-label" class="muted"></span>
            <select id="network-mode" aria-label="Wallpaper network mode">
              <option value="system">跟随系统代理</option>
              <option value="direct">直接连接</option>
            </select>
          </label>
          <button id="search" type="button" class="primary"></button>
        </form>
        <div class="presets" id="presets"></div>
        <div class="layout">
          <div>
            <p id="result-summary" class="muted" aria-live="polite"></p>
            <div id="results" class="results"></div>
          </div>
          <aside id="preview" class="preview" aria-live="polite"></aside>
        </div>
      </section>
      <section
        id="local-panel"
        role="tabpanel"
        aria-labelledby="local-tab"
        hidden
      >
        <div class="toolbar">
          <p id="local-summary" class="muted"></p>
          <div class="gallery-controls">
            <label class="inline-field"
              ><span id="fit-label"></span>
              <select id="fit">
                <option value="cover">覆盖</option>
                <option value="contain">完整显示</option>
              </select></label
            >
            <div class="gallery-actions">
              <button
                id="refresh"
                type="button"
                data-variant="outline"
              ></button>
              <button id="import" type="button" class="primary"></button>
            </div>
          </div>
        </div>
        <div id="gallery" class="gallery"></div>
      </section>
      <dialog
        id="confirm-dialog"
        aria-labelledby="dialog-title"
        aria-describedby="dialog-description"
      >
        <h2 id="dialog-title"></h2>
        <p id="dialog-description" class="muted"></p>
        <label id="rename-label" hidden
          ><span id="rename-caption"></span
          ><input id="rename-value" maxlength="120"
        /></label>
        <div class="actions">
          <button
            id="dialog-cancel"
            type="button"
            data-variant="outline"
          ></button
          ><button id="dialog-confirm" type="button" class="primary"></button>
        </div>
      </dialog>
    </main>
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        let snapshot = null,
          busy = false,
          tab = "remote",
          entries = [],
          selected = null,
          preview = null,
          entriesQuery = "",
          initialized = false,
          accessEpoch = 0,
          refreshPending = false,
          libraryLoaded = false,
          dialogKind = null,
          dialogItem = null,
          lastResultsState = "";
        let library = { revision: 0, items: [], limit: 24 };
        const tr = (zh, en) => (snapshot?.locale === "en" ? en : zh);
        const allowed = () =>
          snapshot?.grantedPermissions?.includes("wallpapers:manage") &&
          Boolean(starter.services?.request);
        const granted = (capability) =>
          allowed() && snapshot.grantedPermissions.includes(capability);
        function text(tag, value, className) {
          const element = document.createElement(tag);
          element.textContent = value;
          if (className) element.className = className;
          if (["h2", "strong"].includes(tag)) element.title = value;
          return element;
        }
        function dimensions(item) {
          return item.width > 0 && item.height > 0
            ? `${item.width} × ${item.height}`
            : tr("尺寸未知", "Dimensions unavailable");
        }
        function message(value, error = false) {
          if (!value) return;
          void starter
            .notify(value, { tone: error ? "error" : "info" })
            .catch(() => {});
        }
        function failure(error, searching = false) {
          switch (error?.code) {
            case "INVALID_ARGUMENT":
              return tr(
                "图片、名称或搜索参数不可用，请检查输入并重试。",
                "The image, name or search parameters are unavailable. Review your input and retry.",
              );
            case "SETTINGS_CONFLICT":
              return tr(
                "设置已在其他窗口改变，请刷新图库后重试。",
                "Settings changed in another window. Refresh the gallery and retry.",
              );
            case "EXTENSION_UNAVAILABLE":
              return tr(
                "扩展已停用或权限已改变，请重新打开并检查授权。",
                "The extension was disabled or its permissions changed. Reopen it and review its permissions.",
              );
            case "NOT_FOUND":
              return tr(
                "图片已不可用，请重新搜索或刷新图库。",
                "This image is no longer available. Search again or refresh the gallery.",
              );
            case "EXTENSION_TIMEOUT":
              return searching
                ? tr(
                    "搜索超时，请检查网络连接后重试。",
                    "Image search timed out. Check your connection and retry.",
                  )
                : tr(
                    "操作超时，请稍后重试。",
                    "The operation timed out. Try again shortly.",
                  );
            case "EXTENSION_BUSY":
              return tr(
                "壁纸服务正忙，请稍后重试。",
                "The wallpaper service is busy. Try again shortly.",
              );
            default:
              return searching
                ? tr(
                    "搜索失败，请检查网络连接后重试。",
                    "Image search failed. Check your connection and retry.",
                  )
                : tr(
                    "操作失败，请重试。",
                    "The operation failed. Please retry.",
                  );
          }
        }
        function button(
          label,
          action,
          primary = false,
          actionName = "",
          capability = "wallpapers:manage",
        ) {
          const element = text("button", label);
          element.type = "button";
          if (actionName) {
            element.dataset.action = actionName;
            if (
              ["add-to-gallery", "download-original", "open-source"].includes(
                actionName,
              )
            )
              element.id = actionName;
          }
          if (primary) element.className = "primary";
          else element.dataset.variant = "outline";
          element.disabled = busy || !granted(capability);
          element.onclick = () => void work(action);
          return element;
        }
        function isObject(value) {
          return (
            value !== null && typeof value === "object" && !Array.isArray(value)
          );
        }
        function validText(value, limit) {
          return (
            Boolean(value.trim()) &&
            Array.from(value).length <= limit &&
            !/[\u0000-\u001f\u007f-\u009f]/.test(value)
          );
        }
        function isImageData(value) {
          return (
            typeof value === "string" &&
            value.length <= 2 * 1024 * 1024 &&
            /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$/.test(
              value,
            )
          );
        }
        function isImage(value) {
          return (
            isObject(value) &&
            /^[a-f0-9]{16}$/.test(value.resultId) &&
            typeof value.title === "string" &&
            Array.from(value.title).length <= 120 &&
            ["originalUrl", "previewUrl", "sourceUrl"].every(
              (key) =>
                typeof value[key] === "string" &&
                value[key].length <= 4096 &&
                /^https:\/\//.test(value[key]),
            ) &&
            ["width", "height"].every(
              (key) =>
                Number.isSafeInteger(value[key]) &&
                value[key] >= 0 &&
                value[key] <= 30000,
            )
          );
        }
        function isLibrary(value) {
          return (
            isObject(value) &&
            Number.isInteger(value.revision) &&
            value.revision >= 0 &&
            value.revision <= 2147483647 &&
            value.limit === 24 &&
            Array.isArray(value.items) &&
            value.items.length <= value.limit &&
            new Set(value.items.map((item) => item?.id)).size ===
              value.items.length &&
            value.items.every(
              (item) =>
                isObject(item) &&
                /^[a-fA-F0-9]{64}$/.test(item.id) &&
                typeof item.name === "string" &&
                item.name.length <= 1024 &&
                typeof item.active === "boolean" &&
                (item.dataUrl === null || isImageData(item.dataUrl)),
            )
          );
        }
        function validResponse(action, response) {
          if (!isObject(response)) return false;
          switch (action) {
            case "list":
            case "apply":
            case "rename":
            case "remove":
              return isLibrary(response);
            case "import-resource":
              return isLibrary(response.library);
            case "import":
              return response.cancelled === true || isLibrary(response.library);
            case "open-settings":
              return response.opened === true;
            default:
              return false;
          }
        }
        async function request(action, extra = {}) {
          if (!allowed()) throw { code: "EXTENSION_UNAVAILABLE" };
          const epoch = accessEpoch;
          const response = await starter.services.request("wallpaper", {
            action,
            ...extra,
          });
          if (epoch !== accessEpoch || !allowed())
            throw { code: "EXTENSION_UNAVAILABLE" };
          if (!validResponse(action, response))
            throw { code: "EXTENSION_RUN_FAILED" };
          return response;
        }
        function networkMode() {
          return $("network-mode").value === "system" &&
            granted("network:system-proxy")
            ? "system"
            : "direct";
        }
        async function withImage(url, action) {
          if (!granted("network:images"))
            throw { code: "EXTENSION_UNAVAILABLE" };
          const epoch = accessEpoch;
          const resource = await starter.services.request("resources", {
            action: "fetch-image",
            url,
            networkMode: networkMode(),
          });
          const resourceId =
            isObject(resource) && typeof resource.resourceId === "string"
              ? resource.resourceId
              : null;
          try {
            if (epoch !== accessEpoch || !granted("network:images"))
              throw { code: "EXTENSION_UNAVAILABLE" };
            if (
              !resourceId ||
              resourceId.length > 160 ||
              !/^[A-Za-z0-9_-]+$/.test(resourceId) ||
              !["image/jpeg", "image/png", "image/webp"].includes(
                resource.mime,
              ) ||
              !Number.isSafeInteger(resource.bytes) ||
              resource.bytes <= 0 ||
              resource.bytes > 16 * 1024 * 1024 ||
              !Number.isSafeInteger(resource.width) ||
              !Number.isSafeInteger(resource.height) ||
              resource.width <= 0 ||
              resource.height <= 0 ||
              resource.width > 8192 ||
              resource.height > 8192 ||
              resource.width * resource.height > 16000000 ||
              !/^[a-f0-9]{64}$/.test(resource.sha256)
            )
              throw { code: "EXTENSION_RUN_FAILED" };
            return await action(resource);
          } finally {
            if (resourceId)
              await starter.services
                .request("resources", { action: "release", resourceId })
                .catch(() => {});
          }
        }
        function readResults(next) {
          const source = next?.view?.state;
          if (typeof source !== "string" || source.length > 240000) return;
          let state;
          try {
            state = JSON.parse(source);
          } catch {
            return;
          }
          if (
            !isObject(state) ||
            state.schema !== 1 ||
            !Array.isArray(state.items) ||
            state.items.length > 12 ||
            !state.items.every(isImage) ||
            new Set(state.items.map((item) => item.resultId)).size !==
              state.items.length ||
            typeof state.query !== "string" ||
            !validText(state.query, 100)
          )
            return;
          const key = JSON.stringify([state.query, state.items]);
          if (key === lastResultsState) return;
          lastResultsState = key;
          entries = state.items;
          entriesQuery =
            state.items.length || state.error === ""
              ? state.query
              : entriesQuery;
          if (
            selected &&
            !entries.some((item) => item.resultId === selected.resultId)
          ) {
            selected = null;
            preview = null;
          }
        }
        function focusTarget() {
          const active = document.activeElement;
          const id = active?.id;
          const resultId = active?.dataset.resultId;
          const action = active?.dataset.action;
          const wallpaperId = active?.closest(".card")?.dataset.wallpaperId;
          return () =>
            id
              ? $(id)
              : resultId
                ? Array.from(document.querySelectorAll(".result")).find(
                    (element) => element.dataset.resultId === resultId,
                  )
                : action
                  ? Array.from(
                      document.querySelectorAll("button[data-action]"),
                    ).find(
                      (element) =>
                        element.dataset.action === action &&
                        element.closest(".card")?.dataset.wallpaperId ===
                          wallpaperId,
                    )
                  : null;
        }
        function restoreFocus(find) {
          if (document.activeElement !== document.body) return;
          const target = find();
          if (target && !target.disabled && target.getClientRects().length)
            target.focus({ preventScroll: true });
        }
        async function work(action) {
          if (busy || !allowed()) return;
          const returnFocus = focusTarget();
          busy = true;
          render();
          try {
            await action();
          } catch (error) {
            message(failure(error), true);
          } finally {
            busy = false;
            render();
            restoreFocus(returnFocus);
            if (refreshPending) {
              refreshPending = false;
              if (tab === "local" && allowed()) void work(refresh);
            }
          }
        }
        async function refresh() {
          library = await request("list");
          libraryLoaded = true;
        }
        let checkpointTimer = null,
          checkpointRunning = false,
          pendingCheckpoint = null,
          lastCheckpoint = "";
        function checkpointNavigation(immediate = false) {
          pendingCheckpoint = JSON.stringify({
            query: $("query").value,
            tab,
            networkMode: $("network-mode").value,
            fit: $("fit").value,
          });
          clearTimeout(checkpointTimer);
          if (immediate) void flushCheckpoint();
          else checkpointTimer = setTimeout(() => void flushCheckpoint(), 250);
        }
        async function flushCheckpoint() {
          if (checkpointRunning) return;
          checkpointRunning = true;
          try {
            while (pendingCheckpoint !== null) {
              const value = pendingCheckpoint;
              pendingCheckpoint = null;
              if (value === lastCheckpoint) continue;
              await starter.checkpoint(JSON.parse(value), false);
              lastCheckpoint = value;
            }
          } catch {
            message(
              tr(
                "界面草稿未保存，请稍后再试。",
                "The interface draft was not saved. Try again shortly.",
              ),
              true,
            );
          } finally {
            checkpointRunning = false;
          }
        }
        async function search() {
          const query = $("query").value.trim();
          if (!granted("network:https")) {
            message(
              tr(
                "请授予 HTTPS 网络权限以搜索图片；本机图库仍可使用。",
                "Grant HTTPS network access to search images. The local gallery remains available.",
              ),
              true,
            );
            return;
          }
          if (!validText(query, 100)) {
            message(
              tr(
                "搜索关键词需为 1–100 个字符，且不含控制字符。",
                "Enter 1–100 search characters without control characters.",
              ),
              true,
            );
            return;
          }
          checkpointNavigation(true);
          try {
            const epoch = accessEpoch;
            const view = await starter.run("search", {
              query,
              networkMode: networkMode(),
            });
            if (epoch !== accessEpoch || !granted("network:https"))
              throw { code: "EXTENSION_UNAVAILABLE" };
            readResults({ view });
            if (view?.errors?.query) {
              message(view.errors.query, true);
              return;
            }
            if (!entries.length)
              message(
                tr(
                  "没有找到图片，试试其他关键词。",
                  "No images found. Try another keyword.",
                ),
              );
          } catch (error) {
            message(failure(error, true), true);
          }
        }
        async function select(item) {
          if (!granted("network:images")) {
            selected = item;
            preview = null;
            return;
          }
          const epoch = accessEpoch;
          await withImage(item.previewUrl, async ({ resourceId }) => {
            const response = await starter.services.request("resources", {
              action: "preview",
              resourceId,
            });
            if (epoch !== accessEpoch || !granted("network:images"))
              throw { code: "EXTENSION_UNAVAILABLE" };
            if (!isObject(response) || !isImageData(response.dataUrl))
              throw { code: "EXTENSION_RUN_FAILED" };
            selected = item;
            preview = response.dataUrl;
          });
        }
        function renderDialog(kind, item) {
          $("dialog-title").textContent =
            kind === "rename"
              ? tr("重命名壁纸", "Rename wallpaper")
              : tr("移出本机图库？", "Remove from local gallery?");
          $("dialog-description").textContent =
            kind === "rename"
              ? item.name
              : tr(
                  "这不会删除原始图片文件；如果当前正在使用它，应用背景会恢复为纯色。",
                  "The original image file remains. If active, the application returns to a plain background.",
                );
          $("dialog-description").title = $("dialog-description").textContent;
          $("rename-label").hidden = kind !== "rename";
          $("rename-caption").textContent = tr("图片名称", "Image name");
          $("dialog-cancel").textContent = tr("取消", "Cancel");
          $("dialog-confirm").textContent = tr("确认", "Confirm");
        }
        async function confirm(kind, item) {
          const dialog = $("confirm-dialog");
          dialogKind = kind;
          dialogItem = item;
          dialog.returnValue = "no";
          renderDialog(kind, item);
          $("rename-value").value = item.name;
          $("rename-value").setCustomValidity("");
          dialog.showModal();
          if (kind === "rename") $("rename-value").focus();
          return new Promise((resolve) => {
            dialog.onclose = () => {
              dialogKind = null;
              dialogItem = null;
              resolve(
                dialog.returnValue === "yes"
                  ? kind === "rename"
                    ? $("rename-value").value.trim()
                    : true
                  : null,
              );
            };
            $("dialog-cancel").onclick = () => dialog.close("no");
            $("dialog-confirm").onclick = () => {
              const field = $("rename-value");
              if (kind === "rename" && !validText(field.value.trim(), 120)) {
                field.setCustomValidity(
                  tr(
                    "名称需为 1–120 个字符，且不含控制字符。",
                    "Enter 1–120 name characters without control characters.",
                  ),
                );
                field.reportValidity();
                return;
              }
              dialog.close("yes");
            };
            $("rename-value").oninput = () =>
              $("rename-value").setCustomValidity("");
            $("rename-value").onkeydown = (event) => {
              if (event.key === "Enter" && !event.isComposing) {
                event.preventDefault();
                if (!event.repeat) $("dialog-confirm").click();
              }
            };
            dialog.oncancel = () => {
              dialog.returnValue = "no";
            };
          });
        }
        function render() {
          const returnFocus = focusTarget();
          const previousDetails = $("preview").querySelector("details");
          const detailsOpen =
            previousDetails?.open &&
            previousDetails.dataset.resultId === selected?.resultId;
          document.documentElement.lang = snapshot?.locale || "zh-CN";
          if (dialogKind && dialogItem) renderDialog(dialogKind, dialogItem);
          document.title = tr("壁纸库", "Wallpaper Library");
          document
            .querySelector('[role="tablist"]')
            .setAttribute(
              "aria-label",
              tr("壁纸分类", "Wallpaper collections"),
            );
          $("network-mode").setAttribute(
            "aria-label",
            tr("壁纸网络连接方式", "Wallpaper network mode"),
          );
          $("title").textContent = tr("壁纸库", "Wallpaper Library");
          $("settings").textContent = tr("图库设置", "Gallery settings");
          $("remote-tab").textContent = tr("发现壁纸", "Discover");
          $("local-tab").textContent = tr("本机图库", "Local gallery");
          $("source-name").textContent = tr("必应图片", "Bing Images");
          $("source-help-button").setAttribute(
            "aria-label",
            tr("搜索来源与使用说明", "Image source and usage help"),
          );
          $("source-note").textContent = tr(
            "搜索关键词会发送至必应，结果来自第三方网站；使用前请核对来源与使用许可。图库图片会缩放压缩，原图下载上限为 16 MiB / 1600 万像素。网络连接可跟随系统代理或直接连接；本插件只管理应用背景，不改变操作系统壁纸。",
            "Search keywords are sent to Bing and results come from third-party websites. Review each source and its usage rights. Gallery images are resized and compressed; originals are limited to 16 MiB / 16 million pixels. Connect through the system proxy or directly. This plugin manages the application background, not the operating system wallpaper.",
          );
          $("query").setAttribute(
            "aria-label",
            tr("搜索必应图片", "Search Bing Images"),
          );
          $("query").placeholder = tr("搜索图片", "Search images");
          const missing = [];
          if (!allowed())
            missing.push(
              tr(
                "本机图库需要壁纸管理权限。",
                "The local gallery needs wallpaper management.",
              ),
            );
          else {
            if (!granted("network:https"))
              missing.push(
                tr(
                  "搜索需 HTTPS 网络权限；本机图库仍可使用。",
                  "Search needs HTTPS network access; the local gallery remains available.",
                ),
              );
            if (!granted("network:images"))
              missing.push(
                tr(
                  "远程图片需单独授权。",
                  "Remote images need their own grant.",
                ),
              );
            if (!granted("links:open"))
              missing.push(
                tr(
                  "来源链接需单独授权。",
                  "Source links need their own grant.",
                ),
              );
          }
          $("permission").hidden = missing.length === 0;
          $("permission").textContent = missing.join(" ");
          $("search").textContent = busy
            ? tr("处理中…", "Working…")
            : tr("搜索", "Search");
          for (const id of ["settings", "refresh", "import", "fit"])
            $(id).disabled = busy || !allowed();
          for (const id of ["search", "query", "network-mode"])
            $(id).disabled = busy || !granted("network:https");
          $("network-mode").options[0].disabled = !granted(
            "network:system-proxy",
          );
          if (
            !granted("network:system-proxy") &&
            $("network-mode").value === "system"
          )
            $("network-mode").value = "direct";
          $("refresh").textContent = tr("刷新", "Refresh");
          $("import").textContent = tr("导入图片", "Import image");
          $("fit-label").textContent = tr("显示方式", "Fit");
          $("network-label").textContent = tr("连接：", "Connection: ");
          $("network-mode").options[0].text = tr(
            "跟随系统代理（需授权）",
            "Follow system proxy (separate grant)",
          );
          $("network-mode").options[1].text = tr(
            "直接连接",
            "Direct connection",
          );
          $("fit").options[0].text = tr("覆盖", "Cover");
          $("fit").options[1].text = tr("完整显示", "Contain");
          for (const name of ["remote", "local"]) {
            $(name + "-panel").hidden = tab !== name;
            $(name + "-tab").setAttribute(
              "aria-selected",
              String(tab === name),
            );
            $(name + "-tab").tabIndex = tab === name ? 0 : -1;
          }
          $("presets").replaceChildren();
          for (const [zh, en, query] of [
            ["山川", "Mountains", "mountains"],
            ["海洋", "Ocean", "ocean"],
            ["森林", "Forest", "forest"],
            ["星空", "Space", "space nebula"],
          ])
            $("presets").append(
              button(
                tr(zh, en),
                async () => {
                  $("query").value = query;
                  await search();
                },
                false,
                "preset-" + query,
                "network:https",
              ),
            );
          $("result-summary").textContent = tr(
            `${entries.length} 张图片${entriesQuery ? " · " + entriesQuery : ""}`,
            `${entries.length} images${entriesQuery ? " · " + entriesQuery : ""}`,
          );
          $("result-summary").title = $("result-summary").textContent;
          $("results").replaceChildren();
          for (const item of entries) {
            const card = button("", () => select(item));
            card.className = "result";
            card.dataset.resultId = item.resultId;
            card.setAttribute(
              "aria-pressed",
              String(selected?.resultId === item.resultId),
            );
            card.append(
              text("strong", item.title),
              text(
                "span",
                [dimensions(item), item.license].filter(Boolean).join(" · "),
                "muted",
              ),
            );
            $("results").append(card);
          }
          $("preview").replaceChildren();
          if (!selected)
            $("preview").append(
              text(
                "p",
                tr(
                  "搜索并选择一张图片，预览会在这里显示。",
                  "Search and select an image to preview it here.",
                ),
                "placeholder",
              ),
            );
          else {
            if (preview) {
              const image = document.createElement("img");
              image.className = "preview-image";
              image.id = "preview-image";
              image.alt = selected.title;
              image.src = preview;
              $("preview").append(image);
            } else
              $("preview").append(
                text(
                  "p",
                  granted("network:images")
                    ? tr(
                        "再次选择图片以载入预览。",
                        "Select the image again to load its preview.",
                      )
                    : tr(
                        "远程图片未授权，仍可查看来源信息。",
                        "Remote images are not granted. Source details remain available.",
                      ),
                  "placeholder",
                ),
              );
            $("preview").append(text("h2", selected.title));
            const meta = document.createElement("div");
            meta.className = "metadata";
            if (selected.author)
              meta.append(
                text("p", tr("作者：", "Creator: ") + selected.author),
              );
            meta.append(
              text(
                "p",
                selected.license
                  ? tr("许可：", "License: ") + selected.license
                  : tr(
                      "未提供许可信息，请在来源页面核对使用许可。",
                      "License information is unavailable. Review usage rights on the source page.",
                    ),
              ),
            );
            const details = [dimensions(selected)];
            if (selected.bytes > 0)
              details.push(`${(selected.bytes / 1048576).toFixed(1)} MiB`);
            meta.append(
              text("p", details.join(" · ")),
              text("p", selected.sourceUrl, "muted"),
            );
            const detailsPanel = document.createElement("details");
            detailsPanel.className = "image-details";
            detailsPanel.dataset.resultId = selected.resultId;
            detailsPanel.open = Boolean(detailsOpen);
            const summary = text("summary", tr("图片信息", "Image details"));
            summary.id = "image-details-summary";
            detailsPanel.append(summary, meta);
            $("preview").append(detailsPanel);
            const actions = document.createElement("div");
            actions.className = "actions";
            actions.append(
              button(
                tr("加入本机图库", "Add to gallery"),
                async () => {
                  const item = selected;
                  await withImage(item.originalUrl, async ({ resourceId }) => {
                    const response = await request("import-resource", {
                      resourceId,
                      name: item.title,
                    });
                    library = response.library;
                    libraryLoaded = true;
                  });
                  message(
                    tr(
                      "已导入压缩图库版本；原图可单独下载。",
                      "Added a compressed gallery version. Download the original separately.",
                    ),
                  );
                },
                true,
                "add-to-gallery",
                "network:images",
              ),
              button(
                tr("下载原图…", "Save original…"),
                async () => {
                  const item = selected;
                  await withImage(item.originalUrl, async (resource) => {
                    const extension =
                      resource.mime === "image/png"
                        ? "png"
                        : resource.mime === "image/webp"
                          ? "webp"
                          : "jpg";
                    const response = await starter.services.request(
                      "resources",
                      {
                        action: "save",
                        resourceId: resource.resourceId,
                        name: "wallpaper-" + item.resultId + "." + extension,
                      },
                    );
                    if (
                      !isObject(response) ||
                      typeof response.cancelled !== "boolean"
                    )
                      throw { code: "EXTENSION_RUN_FAILED" };
                    message(
                      response.cancelled
                        ? tr("已取消保存。", "Save cancelled.")
                        : tr(
                            "原图已保存至所选位置。",
                            "Original saved to the chosen location.",
                          ),
                    );
                  });
                },
                false,
                "download-original",
                "network:images",
              ),
              button(
                tr("查看来源与许可", "View source & license"),
                () =>
                  starter.services.request("links", {
                    url: selected.sourceUrl,
                  }),
                false,
                "open-source",
                "links:open",
              ),
            );
            $("preview").append(actions);
          }
          $("local-summary").textContent = tr(
            libraryLoaded
              ? `${library.items.length} / ${library.limit} 张`
              : "尚未载入图库",
            libraryLoaded
              ? `${library.items.length} / ${library.limit} images`
              : "Gallery not loaded",
          );
          $("gallery").replaceChildren();
          for (const item of library.items) {
            const card = document.createElement("article");
            card.className = "card" + (item.active ? " active" : "");
            card.dataset.wallpaperId = item.id;
            const image = document.createElement("img");
            if (typeof item.dataUrl === "string") image.src = item.dataUrl;
            image.alt = item.name;
            image.loading = "lazy";
            card.append(
              typeof item.dataUrl === "string"
                ? image
                : text(
                    "p",
                    tr("无法预览此图片", "Preview unavailable"),
                    "placeholder",
                  ),
              text("h2", item.name),
            );
            card.append(
              text(
                "p",
                item.active ? tr("当前应用背景", "Current app background") : "",
                "muted card-status",
              ),
            );
            const actions = document.createElement("div");
            actions.className = "actions";
            actions.append(
              button(
                tr("设为背景", "Apply"),
                async () => {
                  library = await request("apply", {
                    id: item.id,
                    expectedRevision: library.revision,
                    fit: $("fit").value,
                  });
                  message(
                    tr("已设置应用背景。", "Application background updated."),
                  );
                },
                true,
                "apply",
              ),
              button(
                tr("重命名", "Rename"),
                async () => {
                  const name = await confirm("rename", item);
                  if (name)
                    library = await request("rename", { id: item.id, name });
                },
                false,
                "rename",
              ),
              button(
                tr("移除", "Remove"),
                async () => {
                  if (await confirm("remove", item))
                    library = await request("remove", {
                      id: item.id,
                      expectedRevision: library.revision,
                    });
                },
                false,
                "remove",
              ),
            );
            card.append(actions);
            $("gallery").append(card);
          }
          if (!library.items.length)
            $("gallery").append(
              text(
                "p",
                libraryLoaded
                  ? tr("暂无图片", "No images yet")
                  : tr(
                      "点击刷新载入本机图库。",
                      "Refresh to load the local gallery.",
                    ),
                "muted",
              ),
            );
          restoreFocus(returnFocus);
        }
        $("search-form").onsubmit = (event) => {
          event.preventDefault();
        };
        $("search").onclick = () => void work(search);
        $("query").onkeydown = (event) => {
          if (event.key === "Enter" && !event.isComposing) {
            event.preventDefault();
            if (!event.repeat) void work(search);
          }
        };
        $("refresh").onclick = () => void work(refresh);
        $("query").oninput = () => checkpointNavigation();
        $("network-mode").onchange = () => checkpointNavigation(true);
        $("fit").onchange = () => checkpointNavigation(true);
        $("settings").onclick = () => void work(() => request("open-settings"));
        $("import").onclick = () =>
          void work(async () => {
            const response = await request("import");
            if (response.cancelled)
              message(tr("已取消导入。", "Import cancelled."));
            else {
              library = response.library;
              libraryLoaded = true;
              message(
                tr("图片已加入本机图库。", "Image added to the local gallery."),
              );
            }
          });
        for (const name of ["remote", "local"]) {
          $(name + "-tab").onclick = () => {
            tab = name;
            render();
            checkpointNavigation(true);
            if (name === "local") {
              if (busy) refreshPending = true;
              else void work(refresh);
            }
          };
          $(name + "-tab").onkeydown = (event) => {
            if (
              ["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)
            ) {
              event.preventDefault();
              const next =
                event.key === "Home"
                  ? "remote"
                  : event.key === "End"
                    ? "local"
                    : name === "remote"
                      ? "local"
                      : "remote";
              $(next + "-tab").click();
              $(next + "-tab").focus();
            }
          };
        }
        const sourceHelp = $("source-help-button").closest(".help");
        for (const name of ["pointerenter", "focusin"])
          sourceHelp.addEventListener(
            name,
            () => delete sourceHelp.dataset.dismissed,
          );
        for (const name of ["pointerleave", "focusout"])
          sourceHelp.addEventListener(name, () => {
            if (!sourceHelp.contains(document.activeElement))
              delete sourceHelp.dataset.dismissed;
          });
        document.addEventListener("keydown", (event) => {
          if (
            event.key === "Escape" &&
            !$("confirm-dialog").open &&
            (sourceHelp.matches(":hover") ||
              sourceHelp.contains(document.activeElement))
          ) {
            sourceHelp.dataset.dismissed = "true";
            event.preventDefault();
          }
        });
        starter.onChange((next) => {
          const wasAllowed = allowed();
          const previousGrants = (snapshot?.grantedPermissions || [])
            .slice()
            .sort()
            .join(",");
          snapshot = next;
          if (
            previousGrants !==
            (next.grantedPermissions || []).slice().sort().join(",")
          )
            accessEpoch++;
          if (wasAllowed && !allowed()) {
            entries = [];
            entriesQuery = "";
            lastResultsState = "";
            selected = null;
            preview = null;
            library = { revision: 0, items: [], limit: 24 };
            libraryLoaded = false;
            refreshPending = false;
            if ($("confirm-dialog").open) $("confirm-dialog").close("no");
          } else if (!granted("network:images")) {
            preview = null;
          }
          if (allowed()) readResults(next);
          render();
          if (wasAllowed && !allowed())
            message($("permission").textContent, true);
          if (initialized && !wasAllowed && allowed()) {
            if (busy) refreshPending = true;
            else void work(refresh);
          }
        });
        void starter.ready
          .then(async (next) => {
            snapshot = next;
            const saved = next.checkpoint;
            $("network-mode").value = granted("network:system-proxy")
              ? "system"
              : "direct";
            const draftQuery = next.fields?.query;
            if (typeof draftQuery === "string" && draftQuery.length <= 400)
              $("query").value = draftQuery;
            if (
              saved &&
              typeof saved.query === "string" &&
              Array.from(saved.query).length <= 100
            )
              $("query").value = saved.query;
            if (
              saved &&
              ["system", "direct"].includes(saved.networkMode) &&
              (saved.networkMode !== "system" ||
                granted("network:system-proxy"))
            )
              $("network-mode").value = saved.networkMode;
            if (saved && ["cover", "contain"].includes(saved.fit))
              $("fit").value = saved.fit;
            if (saved && ["remote", "local"].includes(saved.tab))
              tab = saved.tab;
            if (allowed()) readResults(next);
            initialized = true;
            render();
            if (allowed()) await work(refresh);
            else message($("permission").textContent, true);
          })
          .catch((error) => message(failure(error), true));
      })();
    </script>
  </body>
</html>
