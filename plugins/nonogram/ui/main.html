<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数织</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          var(--host-font-size, 15px)/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 760px;
        margin: auto;
        padding: 12px;
      }
      h1 {
        font-size: 27px;
        margin: 0;
      }
      .muted {
        font-size: 13px;
        color: var(--muted-foreground);
      }
      header,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      button,
      select {
        font: inherit;
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--card);
        color: var(--foreground);
        padding: 8px 12px;
        cursor: pointer;
      }
      button[aria-disabled="true"] {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      button[aria-selected="true"],
      button.primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      nav {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 14px 0 22px;
      }
      .play {
        display: grid;
        grid-template-columns: minmax(0, 420px) minmax(155px, 1fr);
        gap: 24px;
        align-items: center;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 4px;
        min-width: 0;
      }
      .square,
      .clue {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1;
        min-width: 0;
        white-space: pre-wrap;
        text-align: center;
        font-weight: 650;
        padding: 3px;
      }
      .square {
        font-size: 25px;
        border-radius: 5px;
        touch-action: manipulation;
      }
      .clue {
        font-size: 13px;
        color: var(--muted-foreground);
      }
      .square.filled {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }
      select {
        max-width: 100%;
      }
      #notice {
        margin-top: 20px;
        min-height: 1.5em;
      }
      #error {
        color: var(--destructive);
      }
      details {
        border-top: 1px solid var(--border);
        margin-top: 18px;
        padding-top: 12px;
      }
      summary {
        cursor: pointer;
      }
      dialog {
        max-width: min(380px, calc(100vw - 32px));
        padding: 22px;
        background: var(--card);
        color: var(--foreground);
        border: 1px solid var(--border);
        border-radius: 15px;
      }
      dialog::backdrop {
        background: color-mix(in oklab, var(--foreground) 25%, transparent);
      }
      dialog h2 {
        font-size: 19px;
      }
      @media (max-width: 600px) {
        main {
          padding: 8px;
        }
        .play {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .controls {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          align-items: center;
        }
        .tools {
          margin: 0;
        }
        .clue {
          font-size: 11px;
        }
        .square {
          font-size: 22px;
        }
        nav {
          margin-bottom: 14px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="heading">数织</h1>
        <label
          ><span id="tool-label">标记</span>
          <select disabled id="tool"></select
        ></label>
      </header>
      <nav id="puzzles" role="tablist" aria-label="选择谜题"></nav>
      <section id="puzzle-panel" role="tabpanel" tabindex="-1">
        <div class="play">
          <div id="board" role="group" aria-label="数织棋盘"></div>
          <div class="controls">
            <div id="actions" class="tools"></div>
            <div id="persistence" class="tools"></div>
          </div>
        </div>
      </section>
      <p id="notice" role="status"></p>
      <p id="error" role="alert"></p>
      <p id="storage" class="muted"></p>
      <details>
        <summary id="help-label">怎么玩</summary>
        <p id="help" class="muted">
          数字是该行或该列连续填色的格数，色块之间至少留一空格。选择填色或叉号后点击格子，方向键可移动格子焦点。
        </p>
      </details>
    </main>
    <dialog id="replace" aria-labelledby="replace-title">
      <h2 id="replace-title">替换当前进度？</h2>
      <p id="replace-body">当前棋盘有未保存的更改。</p>
      <div class="row">
        <button type="button" id="cancel">取消</button
        ><button type="button" id="confirm" class="primary">继续</button>
      </div>
    </dialog>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        let current,
          working = false,
          layout = "";
        const tr = (zh, en) => (current?.locale === "en" ? en : zh);
        const all = () =>
          current?.view?.groups.flatMap((group) => group.actions) ?? [];
        function actionButton(action) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.action = action.id;
          button.textContent = action.label;
          button.onclick = () => void act(action.id);
          return button;
        }
        function render() {
          if (!current?.view) return;
          document
            .querySelector("main")
            .setAttribute("aria-busy", String(working || current.busy));
          document
            .querySelectorAll("input, select, textarea")
            .forEach((input) => {
              input.disabled = false;
            });
          const view = current.view,
            signature = JSON.stringify([
              (view.tabs ?? []).map((tab) => tab.id),
              view.groups.map((group) =>
                group.actions.map((action) => action.id),
              ),
            ]);
          if (signature !== layout) {
            layout = signature;
            $("puzzles").replaceChildren();
            $("board").replaceChildren();
            $("actions").replaceChildren();
            $("persistence").replaceChildren();
            (view.tabs ?? []).forEach((tab) => {
              const button = actionButton({ id: tab.id, label: tab.label });
              button.id = `tab-${tab.id}`;
              button.setAttribute("role", "tab");
              button.setAttribute("aria-controls", "puzzle-panel");
              $("puzzles").append(button);
            });
            view.groups.forEach((group) =>
              group.actions.forEach((action) => {
                if (group.board) {
                  const node = action.disabled
                    ? document.createElement("span")
                    : actionButton(action);
                  node.className = action.disabled ? "clue" : "square";
                  if (action.disabled) node.setAttribute("role", "img");
                  node.dataset.cell = action.id;
                  $("board").append(node);
                } else
                  (["save", "load"].includes(action.id)
                    ? $("persistence")
                    : $("actions")
                  ).append(actionButton(action));
              }),
            );
          }
          $("heading").textContent = tr("数织", "Nonogram");
          $("puzzles").setAttribute(
            "aria-label",
            tr("选择谜题", "Choose a puzzle"),
          );
          $("board").setAttribute(
            "aria-label",
            tr("数织棋盘", "Nonogram board"),
          );
          (view.tabs ?? []).forEach((tab) => {
            const button = document.getElementById(`tab-${tab.id}`);
            button.textContent = tab.label;
            button.setAttribute("aria-selected", String(tab.active));
            button.tabIndex = tab.active ? 0 : -1;
            if (tab.active)
              $("puzzle-panel").setAttribute("aria-labelledby", button.id);
          });
          all().forEach((action) => {
            const node = document.querySelector(`[data-cell="${action.id}"]`);
            if (node) {
              node.textContent = action.label;
              node.setAttribute("aria-label", action.ariaLabel ?? action.label);
              node.classList.toggle(
                "filled",
                action.primary && !action.disabled,
              );
            }
          });
          document.querySelectorAll("[data-action]").forEach((button) => {
            const action = all().find(
              (action) => action.id === button.dataset.action,
            );
            const tab = view.tabs?.find(
              (tab) => tab.id === button.dataset.action,
            );
            button.setAttribute(
              "aria-disabled",
              String(
                working ||
                  current.busy ||
                  (!tab && (!action || action.disabled)),
              ),
            );
            if (action && !button.dataset.cell) {
              button.textContent = action.label;
              button.classList.toggle("primary", action.primary);
            }
          });
          const field = view.fields.find((field) => field.id === "tool");
          $("tool-label").textContent = field?.label ?? tr("标记", "Mark");
          if ($("tool").dataset.options !== JSON.stringify(field?.options)) {
            $("tool").dataset.options = JSON.stringify(field?.options);
            $("tool").replaceChildren(
              ...(field?.options ?? []).map(
                (option) => new Option(option.label, option.value),
              ),
            );
          }
          if (!working)
            $("tool").value =
              current.checkpoint?.tool ?? current.fields.tool ?? "fill";
          $("tool").setAttribute(
            "aria-disabled",
            String(working || current.busy),
          );
          $("notice").textContent = view.description;
          $("storage").textContent = current.grantedPermissions.includes(
            "storage",
          )
            ? ""
            : tr(
                "未授权存储：本次仍可游玩，保存进度需在扩展中心授权。",
                "Play without storage. Grant it in Extensions to save progress.",
              );
          $("help-label").textContent = tr("怎么玩", "How to play");
          $("help").textContent = tr(
            "数字是该行或该列连续填色的格数，色块之间至少留一空格。选择填色或叉号后点击格子，方向键可移动格子焦点。",
            "Clues describe consecutive filled runs, separated by a gap. Choose a mark, then select cells. Arrow keys move cell focus.",
          );
        }
        async function confirmReplacement() {
          const dialog = $("replace");
          $("replace-title").textContent = tr(
            "替换当前进度？",
            "Replace current progress?",
          );
          $("replace-body").textContent = tr(
            "当前棋盘有未保存的更改。",
            "This board has unsaved changes.",
          );
          $("cancel").textContent = tr("取消", "Cancel");
          $("confirm").textContent = tr("继续", "Continue");
          dialog.showModal();
          return new Promise((resolve) => {
            dialog.onclose = () => resolve(dialog.returnValue === "yes");
            $("cancel").onclick = () => dialog.close("no");
            $("confirm").onclick = () => dialog.close("yes");
            dialog.oncancel = () => {
              dialog.returnValue = "no";
            };
          });
        }
        async function act(id) {
          const action = all().find((action) => action.id === id),
            tab = current?.view?.tabs?.find((tab) => tab.id === id);
          if (
            working ||
            current?.busy ||
            (!tab && (!action || action.disabled)) ||
            tab?.active
          )
            return;
          const submitted = { tool: $("tool").value };
          working = true;
          render();
          try {
            if (
              current.dirty &&
              (id === "reset" || id === "load" || tab) &&
              !(await confirmReplacement())
            )
              return;
            $("error").textContent = "";
            const previousDirty = current.dirty,
              next = await starter.run(id, submitted);
            const state = JSON.parse(next.state),
              saved = ["saved", "loaded"].includes(state.notice);
            const dirty = saved
              ? false
              : id === "check"
                ? previousDirty
                : state.history.length > 0;
            await starter.checkpoint(null, dirty);
            current = {
              ...current,
              view: next,
              fields: Object.fromEntries(
                next.fields.map((field) => [field.id, field.value]),
              ),
              checkpoint: null,
            };
          } catch {
            $("error").textContent = tr(
              "操作未完成，当前棋盘已保留。",
              "The operation did not finish. Your board was retained.",
            );
          } finally {
            working = false;
            render();
          }
        }
        $("tool").onchange = () => {
          if (working || current?.busy) {
            render();
            return;
          }
          void starter
            .checkpoint({ tool: $("tool").value }, current?.dirty ?? false)
            .catch(() => {
              $("error").textContent = tr(
                "草稿保留失败，请重试。",
                "Could not retain the draft. Please retry.",
              );
            });
        };
        $("board").onkeydown = (event) => {
          const cells = [...$("board").querySelectorAll("button")],
            index = cells.indexOf(document.activeElement);
          if (index < 0) return;
          const offset = {
            ArrowLeft: -1,
            ArrowRight: 1,
            ArrowUp: -5,
            ArrowDown: 5,
          }[event.key];
          if (offset) {
            event.preventDefault();
            cells[Math.max(0, Math.min(24, index + offset))]?.focus();
          }
        };
        $("puzzles").onkeydown = (event) => {
          if (!["ArrowLeft", "ArrowRight"].includes(event.key)) return;
          const tabs = [...$("puzzles").children],
            index = tabs.indexOf(document.activeElement);
          event.preventDefault();
          tabs[
            (index + (event.key === "ArrowRight" ? 1 : tabs.length - 1)) %
              tabs.length
          ]?.focus();
        };
        starter.onChange((snapshot) => {
          current = snapshot;
          render();
        });
      })();
    </script>
  </body>
</html>
