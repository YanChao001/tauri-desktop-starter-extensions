<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文本工具箱</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          var(--host-font-size, 15px)/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1060px;
        margin: auto;
        padding: 12px;
      }
      h1 {
        margin: 0;
        font-size: 27px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      button,
      select,
      textarea {
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--foreground);
        padding: 9px 12px;
      }
      button {
        min-height: 42px;
        cursor: pointer;
      }
      button:hover {
        background: var(--muted);
      }
      button.primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      button[aria-disabled="true"] {
        opacity: 0.5;
        cursor: default;
      }
      button:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      .toolbar {
        margin: 18px 0;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      select {
        max-width: 100%;
        min-width: 160px;
      }
      .columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .pane {
        display: flex;
        flex-direction: column;
        gap: 9px;
        min-width: 0;
      }
      .pane textarea,
      .pane pre {
        width: 100%;
        min-height: 320px;
        flex: 1;
        line-height: 1.7;
        font:
          14px/1.7 ui-monospace,
          monospace;
      }
      .pane pre {
        margin: 0;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--muted);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 60vh;
        overflow: auto;
      }
      .metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 20px;
        margin-top: 18px;
        font-size: 12px;
        color: var(--muted-foreground);
      }
      .metrics strong {
        color: var(--foreground);
        padding-left: 5px;
      }
      .muted {
        color: var(--muted-foreground);
        font-size: 13px;
      }
      #error {
        color: var(--destructive);
      }
      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      @media (max-width: 650px) {
        main {
          padding: 8px;
        }
        .columns {
          grid-template-columns: 1fr;
        }
        .pane textarea,
        .pane pre {
          min-height: 220px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="row">
        <h1 id="heading">文本工坊</h1>
        <div class="actions">
          <button type="button" data-action="demo">示例</button
          ><button type="button" data-action="clear">清空</button>
        </div>
      </div>
      <div class="toolbar">
        <label for="mode" id="mode-label">转换操作</label
        ><select disabled id="mode"></select
        ><button type="button" class="primary" data-action="apply">
          处理 / 统计
        </button>
      </div>
      <div class="columns">
        <section class="pane" aria-labelledby="input-label">
          <div class="row">
            <label for="text" id="input-label">输入文本</label
            ><span class="muted" id="limit">最多 32 KiB</span>
          </div>
          <textarea disabled id="text" spellcheck="false"></textarea>
        </section>
        <section class="pane" aria-labelledby="output-label">
          <div class="row">
            <h2 id="output-label" class="muted">转换结果</h2>
            <button type="button" data-action="use-result">用作输入</button>
          </div>
          <pre id="output" tabindex="0"></pre>
          <div class="actions">
            <button type="button" data-action="export-txt">导出 TXT</button
            ><button type="button" data-action="export-md">
              导出 Markdown
            </button>
          </div>
        </section>
      </div>
      <div id="metrics" class="metrics"></div>
      <p id="description" class="muted"></p>
      <p id="error" role="alert"></p>
    </main>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        let current,
          working = false,
          force = false;
        const tr = (zh, en) => (current?.locale === "en" ? en : zh);
        const all = () =>
          current?.view?.groups.flatMap((group) => group.actions) ?? [];
        const values = () => ({ text: $("text").value, mode: $("mode").value });
        function render() {
          if (!current?.view) return;
          document
            .querySelector("main")
            .setAttribute("aria-busy", String(working || current.busy));
          document
            .querySelectorAll("input, select, textarea")
            .forEach((input) => {
              input.disabled = false;
            });
          const view = current.view,
            field = view.fields.find((field) => field.id === "mode");
          $("heading").textContent = tr("文本工坊", "Text workshop");
          $("input-label").textContent = tr("输入文本", "Input text");
          $("output-label").textContent = tr("转换结果", "Result");
          $("mode-label").textContent =
            field?.label ?? tr("转换操作", "Operation");
          $("limit").textContent = tr("最多 32 KiB", "Up to 32 KiB");
          if ($("mode").dataset.options !== JSON.stringify(field?.options)) {
            $("mode").dataset.options = JSON.stringify(field?.options);
            $("mode").replaceChildren(
              ...(field?.options ?? []).map(
                (option) => new Option(option.label, option.value),
              ),
            );
          }
          const draft = current.checkpoint?.fields;
          for (const id of ["text", "mode"]) {
            if (!working && (force || document.activeElement !== $(id)))
              $(id).value =
                (force ? undefined : draft?.[id]) ?? current.fields[id] ?? "";
            $(id).readOnly = working || current.busy;
          }
          force = false;
          const markdown =
            view.blocks
              ?.filter((block) => block.kind === "markdown")
              .map((block) => block.text)
              .join("\n") ?? "";
          $("output").textContent = markdown
            .split("\n")
            .filter((line) => line.startsWith("    "))
            .map((line) => line.slice(4))
            .join("\n");
          $("metrics").replaceChildren(
            ...(
              view.blocks?.find((block) => block.kind === "metrics")?.items ??
              []
            ).map((item) => {
              const span = document.createElement("span"),
                value = document.createElement("strong");
              value.textContent = item.value;
              span.append(document.createTextNode(item.label), value);
              return span;
            }),
          );
          $("description").textContent = view.description;
          document.querySelectorAll("[data-action]").forEach((button) => {
            const action = all().find(
              (action) => action.id === button.dataset.action,
            );
            button.setAttribute(
              "aria-disabled",
              String(working || current.busy || !action || action.disabled),
            );
            if (action)
              button.textContent =
                action.id === "export-txt"
                  ? tr("导出 TXT", "Export TXT")
                  : action.id === "export-md"
                    ? tr("导出 Markdown", "Export Markdown")
                    : action.label;
          });
          const error = view.errors?.text;
          $("text").setAttribute("aria-invalid", String(!!error));
          if (error) $("error").textContent = error;
        }
        async function act(id) {
          const action = all().find((action) => action.id === id);
          if (working || current?.busy || !action || action.disabled) return;
          const submitted = values();
          working = true;
          render();
          try {
            $("error").textContent = "";
            const next = await starter.run(id, submitted);
            if (id.startsWith("export-") && next.artifacts?.length)
              await starter.saveArtifact(0);
            await starter.checkpoint(null, id !== "clear");
            current = {
              ...current,
              view: next,
              fields: Object.fromEntries(
                next.fields.map((field) => [field.id, field.value]),
              ),
              checkpoint: null,
            };
            force = true;
          } catch {
            $("error").textContent = tr(
              "处理失败，原文和上次结果已保留。",
              "Could not process the text. Your input and last result were retained.",
            );
          } finally {
            working = false;
            render();
          }
        }
        document
          .querySelectorAll("[data-action]")
          .forEach(
            (button) =>
              (button.onclick = () => void act(button.dataset.action)),
          );
        for (const id of ["text", "mode"])
          $(id).addEventListener(id === "mode" ? "change" : "input", () => {
            if (working || current?.busy) {
              force = true;
              render();
              return;
            }
            void starter.checkpoint({ fields: values() }, true).catch(() => {
              $("error").textContent = tr(
                "草稿保留失败，请重试。",
                "Could not retain the draft. Please retry.",
              );
            });
          });
        $("text").onkeydown = (event) => {
          if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
            event.preventDefault();
            void act("apply");
          }
        };
        starter.onChange((snapshot) => {
          current = snapshot;
          render();
        });
      })();
    </script>
  </body>
</html>
