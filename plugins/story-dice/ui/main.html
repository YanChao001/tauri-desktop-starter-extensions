<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>故事骰子</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          var(--host-font-size, 15px)/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 1040px;
        margin: auto;
        padding: 12px;
      }
      h1 {
        font-size: 27px;
        margin: 0;
      }
      header,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(230px, 1fr) minmax(260px, 1.55fr);
        gap: 22px;
        margin-top: 20px;
      }
      .cards {
        display: grid;
        gap: 9px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 13px;
        padding: 12px;
      }
      .card h2 {
        font-size: 12px;
        color: var(--muted-foreground);
        margin: 0;
      }
      .card p {
        margin: 7px 0 0;
        font-size: 16px;
      }
      .card label {
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .card.locked {
        border-color: var(--primary);
        background: color-mix(in oklab, var(--primary) 5%, var(--background));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--card);
        color: var(--foreground);
        padding: 9px 12px;
      }
      button {
        min-height: 42px;
        cursor: pointer;
      }
      button:hover {
        background: var(--muted);
      }
      button.primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      button[aria-disabled="true"] {
        opacity: 0.5;
        cursor: default;
      }
      input:not([type="checkbox"]),
      select,
      textarea {
        width: 100%;
        min-width: 0;
      }
      input[type="checkbox"] {
        accent-color: var(--primary);
      }
      header select {
        width: auto;
        max-width: 100%;
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      .editor {
        display: flex;
        flex-direction: column;
        min-width: 0;
        gap: 10px;
      }
      .editor label,
      .parameter {
        display: grid;
        gap: 5px;
      }
      .editor textarea {
        min-height: 340px;
        flex: 1;
        resize: vertical;
        line-height: 1.8;
      }
      .editor [data-field="title"] {
        font-size: 20px;
        font-weight: 650;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .muted {
        font-size: 13px;
        color: var(--muted-foreground);
      }
      details {
        margin-top: 16px;
      }
      summary {
        cursor: pointer;
      }
      .parameters {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }
      #error {
        color: var(--destructive);
      }
      #history,
      #favorites {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 10px;
      }
      dialog {
        max-width: min(390px, calc(100vw - 32px));
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 15px;
        color: var(--foreground);
        background: var(--card);
      }
      dialog::backdrop {
        background: color-mix(in oklab, var(--foreground) 25%, transparent);
      }
      dialog h2 {
        font-size: 19px;
      }
      .mobile-hint {
        display: none;
      }
      @media (max-width: 560px) {
        main {
          padding: 8px;
        }
        .layout {
          grid-template-columns: 1fr;
          gap: 16px;
        }
        .cards {
          grid-auto-flow: column;
          grid-auto-columns: 86%;
          overflow-x: auto;
          scroll-snap-type: x proximity;
          padding: 4px 4px 12px;
        }
        .card {
          scroll-snap-align: start;
        }
        .mobile-hint {
          display: block;
          margin: 4px 0;
        }
        .card p {
          font-size: 15px;
        }
        .editor textarea {
          min-height: 300px;
        }
        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="heading">故事骰子</h1>
        <div class="row">
          <label
            ><span id="genre-label">题材</span>
            <select disabled data-field="genre" id="genre"></select></label
          ><button type="button" data-action="roll" class="primary">
            掷出新灵感
          </button>
        </div>
      </header>
      <div class="layout">
        <section aria-labelledby="inspiration-title">
          <div class="row">
            <h2 id="inspiration-title" class="muted">灵感卡片</h2>
            <button type="button" data-action="unlock">解除锁定</button>
          </div>
          <p id="browse-hint" class="muted mobile-hint">
            左右滑动查看五张灵感卡。
          </p>
          <div id="cards" class="cards"></div>
          <details>
            <summary id="parameters-label">种子与序号</summary>
            <div class="parameters">
              <label class="parameter"
                ><span id="seed-label">种子</span
                ><input disabled data-field="seed" id="seed" /></label
              ><label class="parameter"
                ><span id="turn-label">下一次序号</span
                ><input
                  disabled
                  data-field="turn"
                  id="turn"
                  inputmode="numeric"
              /></label>
            </div>
          </details>
        </section>
        <section class="editor" aria-labelledby="draft-label">
          <label
            ><span id="title-label" class="muted">标题</span
            ><input disabled data-field="title" id="title" /></label
          ><label id="draft-label" for="draft">写作草稿</label
          ><textarea
            disabled
            data-field="draft"
            id="draft"
            spellcheck="false"
          ></textarea>
          <div class="actions">
            <button type="button" data-action="use-prompt">写入灵感</button
            ><button type="button" data-action="save">收藏草稿</button
            ><button type="button" data-action="export">导出 Markdown</button>
          </div>
          <p id="storage" class="muted"></p>
        </section>
      </div>
      <p id="notice" class="muted" role="status"></p>
      <p id="error" role="alert"></p>
      <details>
        <summary id="history-label">灵感历史</summary>
        <div id="history"></div>
      </details>
      <details>
        <summary id="favorites-label">我的收藏</summary>
        <div id="favorites"></div>
      </details>
    </main>
    <dialog id="replace" aria-labelledby="replace-title">
      <h2 id="replace-title">确认替换？</h2>
      <p id="replace-body">这会替换当前草稿。</p>
      <div class="row">
        <button type="button" id="cancel">取消</button
        ><button type="button" id="confirm" class="primary">继续</button>
      </div>
    </dialog>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        let current,
          working = false,
          force = false,
          historyKey = "";
        const tr = (zh, en) => (current?.locale === "en" ? en : zh);
        const all = () =>
          current?.view?.groups.flatMap((group) => group.actions) ?? [];
        const cards = Array.from({ length: 5 }, (_, index) => {
          const article = document.createElement("article");
          article.className = "card";
          const row = document.createElement("div");
          row.className = "row";
          const heading = document.createElement("h2"),
            label = document.createElement("label"),
            input = document.createElement("input"),
            caption = document.createElement("span"),
            text = document.createElement("p");
          input.type = "checkbox";
          input.dataset.field = `lock-${index}`;
          label.append(input, caption);
          row.append(heading, label);
          article.append(row, text);
          $("cards").append(article);
          return { article, heading, input, caption, text };
        });
        function values() {
          return Object.fromEntries(
            [...document.querySelectorAll("[data-field]")].map((input) => [
              input.dataset.field,
              input.type === "checkbox" ? String(input.checked) : input.value,
            ]),
          );
        }
        function checkpoint() {
          void starter.checkpoint({ fields: values() }, true).catch(() => {
            $("error").textContent = tr(
              "草稿保留失败，请重试。",
              "Could not retain the draft. Please retry.",
            );
          });
        }
        function render() {
          if (!current?.view) return;
          document
            .querySelector("main")
            .setAttribute("aria-busy", String(working || current.busy));
          document
            .querySelectorAll("input, select, textarea")
            .forEach((input) => {
              input.disabled = false;
            });
          const view = current.view,
            table = view.blocks?.find((block) => block.kind === "table");
          $("heading").textContent = tr("故事骰子", "Story dice");
          $("inspiration-title").textContent = tr(
            "灵感卡片",
            "Inspiration cards",
          );
          $("browse-hint").textContent = tr(
            "左右滑动查看五张灵感卡。",
            "Scroll sideways to browse the five cards.",
          );
          cards.forEach((card, index) => {
            const row = table?.rows[index] ?? [];
            card.heading.textContent = row[0] ?? "";
            card.text.textContent = row[1] ?? "";
            card.caption.textContent = tr("锁定", "Lock");
          });
          for (const field of view.fields) {
            const input = document.querySelector(`[data-field="${field.id}"]`);
            if (!input) continue;
            if (
              input instanceof HTMLSelectElement &&
              input.dataset.options !== JSON.stringify(field.options)
            ) {
              input.dataset.options = JSON.stringify(field.options);
              input.replaceChildren(
                ...(field.options ?? []).map(
                  (option) => new Option(option.label, option.value),
                ),
              );
            }
            const retained = force
                ? undefined
                : current.checkpoint?.fields?.[field.id],
              value =
                typeof retained === "string"
                  ? retained
                  : (current.fields[field.id] ?? field.value);
            if (!working && (force || document.activeElement !== input)) {
              if (input.type === "checkbox") input.checked = value === "true";
              else input.value = value;
            }
            input.setAttribute("aria-label", field.label);
            input.setAttribute(
              "aria-invalid",
              String(!!view.errors?.[field.id]),
            );
            input.readOnly = working || current.busy;
            input.setAttribute(
              "aria-disabled",
              String(working || current.busy),
            );
            const label = document.getElementById(`${field.id}-label`);
            if (label && !field.id.startsWith("lock-"))
              label.textContent = field.label;
          }
          cards.forEach((card) =>
            card.article.classList.toggle("locked", card.input.checked),
          );
          force = false;
          const extra = all().filter((action) =>
            /^(history|favorite|remove)-/.test(action.id),
          );
          const signature = JSON.stringify(extra);
          if (signature !== historyKey) {
            historyKey = signature;
            $("history").replaceChildren();
            $("favorites").replaceChildren();
            extra.forEach((action) => {
              const button = document.createElement("button");
              button.type = "button";
              button.dataset.action = action.id;
              button.textContent = action.label;
              button.onclick = () => void act(action.id);
              $(
                action.id.startsWith("history-") ? "history" : "favorites",
              ).append(button);
            });
          }
          document.querySelectorAll("[data-action]").forEach((button) => {
            const action = all().find(
              (action) => action.id === button.dataset.action,
            );
            button.setAttribute(
              "aria-disabled",
              String(working || current.busy || !action || action.disabled),
            );
            if (action)
              button.textContent =
                action.id === "export"
                  ? tr("导出 Markdown", "Export Markdown")
                  : action.label;
          });
          $("storage").textContent = current.grantedPermissions.includes(
            "storage",
          )
            ? ""
            : tr(
                "草稿与掷骰可直接使用，收藏需授权私有存储。",
                "Draft and roll freely. Favorites require private storage.",
              );
          const state = JSON.parse(view.state);
          $("notice").textContent = state.status ?? "";
          $("parameters-label").textContent = tr("种子与序号", "Seed & turn");
          $("history-label").textContent = tr("灵感历史", "Prompt history");
          $("favorites-label").textContent = tr("我的收藏", "My favorites");
        }
        async function confirmAction(id) {
          const dialog = $("replace");
          $("replace-title").textContent = tr(
            "确认此操作？",
            "Confirm this action?",
          );
          $("replace-body").textContent = id.startsWith("remove-")
            ? tr(
                "这会移除此条收藏，当前草稿保留。",
                "This removes the favorite and keeps your draft.",
              )
            : tr(
                "这会替换当前草稿。你可以取消，先导出或收藏。",
                "This replaces the current draft. Cancel to export or favorite it first.",
              );
          $("cancel").textContent = tr("取消", "Cancel");
          $("confirm").textContent = tr("继续", "Continue");
          dialog.showModal();
          return new Promise((resolve) => {
            dialog.onclose = () => resolve(dialog.returnValue === "yes");
            $("cancel").onclick = () => dialog.close("no");
            $("confirm").onclick = () => dialog.close("yes");
            dialog.oncancel = () => {
              dialog.returnValue = "no";
            };
          });
        }
        async function act(id) {
          const action = all().find((action) => action.id === id);
          if (working || current?.busy || !action || action.disabled) return;
          const submitted = values();
          working = true;
          render();
          try {
            if (
              (id.startsWith("remove-") ||
                ((id === "use-prompt" || id.startsWith("favorite-")) &&
                  $("draft").value.trim())) &&
              !(await confirmAction(id))
            )
              return;
            $("error").textContent = "";
            const next = await starter.run(id, submitted);
            force = true;
            let dirty = true;
            if (id === "save" && JSON.parse(next.state).persisted === true)
              dirty = false;
            if (id === "export" && next.artifacts?.length)
              dirty = !(await starter.saveArtifact(0));
            await starter.checkpoint(null, dirty);
            current = {
              ...current,
              view: next,
              fields: Object.fromEntries(
                next.fields.map((field) => [field.id, field.value]),
              ),
              checkpoint: null,
            };
            force = true;
          } catch {
            $("error").textContent = tr(
              "操作未完成，草稿已保留。",
              "The operation did not finish. Your draft was retained.",
            );
          } finally {
            working = false;
            render();
          }
        }
        document
          .querySelectorAll("[data-action]")
          .forEach(
            (button) =>
              (button.onclick = () => void act(button.dataset.action)),
          );
        document.querySelectorAll("[data-field]").forEach((input) => {
          input.addEventListener(
            input.type === "checkbox" || input instanceof HTMLSelectElement
              ? "change"
              : "input",
            () => {
              if (working || current?.busy) {
                force = true;
                render();
                return;
              }
              checkpoint();
            },
          );
        });
        starter.onChange((snapshot) => {
          current = snapshot;
          render();
        });
      })();
    </script>
  </body>
</html>
