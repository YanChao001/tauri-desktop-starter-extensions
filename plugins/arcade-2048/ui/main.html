<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数字合并</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--foreground);
        background: var(--background);
        font:
          var(--host-font-size, 15px)/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 820px;
        margin: auto;
        padding: 12px;
      }
      h1 {
        font-size: 40px;
        line-height: 1;
        margin: 0;
      }
      header,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .scores {
        display: flex;
        gap: 8px;
      }
      .score {
        min-width: 66px;
        padding: 7px 12px;
        border-radius: 12px;
        background: var(--muted);
        text-align: center;
      }
      .score small {
        display: block;
        color: var(--muted-foreground);
        font-size: 11px;
      }
      .score strong {
        font-size: 21px;
      }
      .play {
        display: grid;
        grid-template-columns: minmax(0, 420px) minmax(150px, 1fr);
        gap: 24px;
        align-items: center;
        margin-top: 20px;
      }
      #board {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 9px;
        padding: 10px;
        background: var(--muted);
        border-radius: 18px;
        touch-action: none;
        outline-offset: 4px;
      }
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 1;
        min-width: 0;
        border-radius: 10px;
        font-size: clamp(19px, 5vw, 32px);
        font-weight: 750;
        font-variant-numeric: tabular-nums;
        background: var(--card);
      }
      button,
      input {
        font: inherit;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--card);
        color: var(--foreground);
        padding: 10px 14px;
        min-height: 44px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: var(--muted);
      }
      button:focus-visible,
      input:focus-visible,
      #board:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      button[aria-disabled="true"] {
        opacity: 0.5;
        cursor: default;
      }
      .primary {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
        margin: 16px 0;
      }
      .pad button {
        font-size: 24px;
        padding: 6px;
      }
      [data-action="up"] {
        grid-column: 2;
      }
      [data-action="left"] {
        grid-row: 2;
        grid-column: 1;
      }
      [data-action="down"] {
        grid-row: 2;
        grid-column: 2;
      }
      [data-action="right"] {
        grid-row: 2;
        grid-column: 3;
      }
      .muted {
        color: var(--muted-foreground);
        font-size: 13px;
      }
      details {
        margin-top: 16px;
      }
      summary {
        cursor: pointer;
      }
      input {
        width: 100%;
        margin-top: 6px;
      }
      #notice {
        min-height: 1.5em;
      }
      #error {
        color: var(--destructive);
      }
      @media (max-width: 620px) {
        .play {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        main {
          padding: 8px;
        }
        .controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0 14px;
          align-items: center;
        }
        .pad {
          grid-column: 1;
        }
        .extras {
          grid-column: 2;
        }
        h1 {
          font-size: 32px;
        }
        .score {
          min-width: 56px;
          padding: 5px 8px;
        }
        .tile {
          font-size: 25px;
        }
        #board {
          gap: 7px;
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>2048</h1>
        <div class="scores">
          <div class="score">
            <small id="score-label">分数</small><strong id="score">0</strong>
          </div>
          <div class="score">
            <small id="best-label">纪录</small><strong id="best">0</strong>
          </div>
          <div class="score">
            <small id="steps-label">步数</small><strong id="steps">0</strong>
          </div>
        </div>
      </header>
      <div class="play">
        <div
          id="board"
          role="group"
          tabindex="0"
          aria-label="2048 棋盘"
          aria-describedby="help"
        ></div>
        <div class="controls">
          <div class="pad">
            <button type="button" data-action="up">↑</button
            ><button type="button" data-action="left">←</button
            ><button type="button" data-action="down">↓</button
            ><button type="button" data-action="right">→</button>
          </div>
          <div class="extras">
            <div class="row">
              <button type="button" data-action="undo">撤销</button
              ><button type="button" data-action="new-game" class="primary">
                新游戏
              </button>
            </div>
            <p id="help" class="muted">使用方向键，或在棋盘上滑动。</p>
            <button type="button" data-action="save-best">保存纪录</button>
            <p id="storage" class="muted"></p>
          </div>
        </div>
      </div>
      <p id="notice" class="muted" role="status"></p>
      <p id="error" role="alert"></p>
      <details>
        <summary id="settings-label">开局设置与玩法</summary>
        <label id="seed-label" for="seed">开局种子</label
        ><input disabled id="seed" type="number" inputmode="numeric" />
        <p id="rules" class="muted">
          合并相同数字；无效移动不生成方块。新游戏使用上方种子。
        </p>
      </details>
    </main>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id),
          board = $("board");
        let current,
          working = false,
          pointer;
        const tiles = Array.from({ length: 16 }, () => {
          const cell = document.createElement("span");
          cell.className = "tile";
          cell.setAttribute("role", "img");
          board.append(cell);
          return cell;
        });
        const tr = (zh, en) => (current?.locale === "en" ? en : zh);
        function actions() {
          return current?.view?.groups.flatMap((group) => group.actions) ?? [];
        }
        function paint() {
          if (!current?.view) return;
          document
            .querySelector("main")
            .setAttribute("aria-busy", String(working || current.busy));
          document
            .querySelectorAll("input, select, textarea")
            .forEach((input) => {
              input.disabled = false;
            });
          const metrics =
            current.view.blocks?.find((block) => block.kind === "metrics")
              ?.items ?? [];
          ["score", "best", "steps"].forEach(
            (id, index) => ($(id).textContent = metrics[index]?.value ?? "0"),
          );
          $("score-label").textContent = tr("分数", "Score");
          $("best-label").textContent = tr("纪录", "Best");
          $("steps-label").textContent = tr("步数", "Moves");
          const cells =
            current.view.groups.find((group) => group.board)?.actions ?? [];
          tiles.forEach((tile, index) => {
            const value = cells[index]?.label ?? "·",
              number = Number(value);
            tile.textContent = number ? value : "";
            tile.setAttribute("aria-label", cells[index]?.ariaLabel ?? value);
            tile.style.background =
              number >= 128
                ? "var(--primary)"
                : number
                  ? `color-mix(in oklab,var(--primary) ${18 + Math.min(6, Math.log2(number)) * 5}%,var(--card))`
                  : "var(--card)";
            tile.style.color =
              number >= 128 ? "var(--primary-foreground)" : "var(--foreground)";
          });
          document.querySelectorAll("[data-action]").forEach((button) => {
            const action = actions().find(
              (action) => action.id === button.dataset.action,
            );
            button.setAttribute(
              "aria-disabled",
              String(working || current.busy || !action || action.disabled),
            );
            button.setAttribute(
              "aria-label",
              action?.label ?? button.dataset.action,
            );
            if (
              !["up", "left", "down", "right"].includes(button.dataset.action)
            )
              button.textContent = action?.label ?? button.dataset.action;
          });
          board.setAttribute("aria-label", tr("2048 棋盘", "2048 board"));
          $("help").textContent = tr(
            "使用方向键，或在棋盘上滑动。",
            "Use arrow keys or swipe the board.",
          );
          $("storage").textContent = current.grantedPermissions.includes(
            "storage",
          )
            ? ""
            : tr(
                "当前为会话纪录；授权存储后可保存。",
                "Session records only. Grant storage to save your best.",
              );
          $("notice").textContent = current.view.description;
          $("seed-label").textContent =
            current.view.fields.find((field) => field.id === "seed")?.label ??
            tr("开局种子", "Seed");
          if (!working && document.activeElement !== $("seed"))
            $("seed").value =
              current.checkpoint?.seed ?? current.fields.seed ?? "";
          $("seed").readOnly = working || current.busy;
          $("settings-label").textContent = tr(
            "开局设置与玩法",
            "New-game settings & rules",
          );
          $("rules").textContent = tr(
            "合并相同数字；无效移动不生成方块。新游戏使用上方种子。",
            "Merge equal tiles. Invalid moves add no tiles. A new game uses this seed.",
          );
        }
        async function act(id) {
          const action = actions().find((action) => action.id === id);
          if (working || current?.busy || !action || action.disabled) return;
          const submitted = { seed: $("seed").value };
          working = true;
          $("error").textContent = "";
          paint();
          try {
            const next = await starter.run(id, submitted);
            const played = JSON.parse(next.state).history?.length > 0;
            await starter.checkpoint(
              id === "new-game" ? null : submitted,
              played,
            );
            current = {
              ...current,
              view: next,
              fields: Object.fromEntries(
                next.fields.map((field) => [field.id, field.value]),
              ),
              checkpoint: id === "new-game" ? null : submitted,
            };
          } catch {
            $("error").textContent = tr(
              "操作失败，棋局和输入已保留。",
              "The operation failed. Your board and input were retained.",
            );
          } finally {
            working = false;
            paint();
          }
        }
        document
          .querySelectorAll("[data-action]")
          .forEach(
            (button) =>
              (button.onclick = () => void act(button.dataset.action)),
          );
        document.addEventListener("keydown", (event) => {
          if (
            event.target instanceof HTMLInputElement ||
            event.altKey ||
            event.ctrlKey ||
            event.metaKey
          )
            return;
          const id = {
            ArrowLeft: "left",
            ArrowUp: "up",
            ArrowDown: "down",
            ArrowRight: "right",
          }[event.key];
          if (id) {
            event.preventDefault();
            void act(id);
          }
        });
        board.onpointerdown = (event) => {
          pointer = { x: event.clientX, y: event.clientY, id: event.pointerId };
          board.setPointerCapture(event.pointerId);
        };
        board.onpointerup = (event) => {
          if (!pointer || pointer.id !== event.pointerId) return;
          const dx = event.clientX - pointer.x,
            dy = event.clientY - pointer.y;
          pointer = null;
          if (Math.max(Math.abs(dx), Math.abs(dy)) >= 24)
            void act(
              Math.abs(dx) > Math.abs(dy)
                ? dx > 0
                  ? "right"
                  : "left"
                : dy > 0
                  ? "down"
                  : "up",
            );
        };
        board.onpointercancel = () => {
          pointer = null;
        };
        $("seed").oninput = () => {
          void starter.checkpoint({ seed: $("seed").value }, true).catch(() => {
            $("error").textContent = tr(
              "草稿保存失败，请重试。",
              "Could not retain the draft. Please retry.",
            );
          });
        };
        starter.onChange((snapshot) => {
          current = snapshot;
          paint();
        });
      })();
    </script>
  </body>
</html>
