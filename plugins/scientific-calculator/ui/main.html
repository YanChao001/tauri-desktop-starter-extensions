<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>计算器</title>
    <style>
      :root {
        color-scheme: light;
        --win-background: #f3f3f3;
        --win-foreground: #1a1a1a;
        --win-muted: #606060;
        --win-key: #f9f9f9;
        --win-number: #ffffff;
        --win-hover: #f0f0f0;
        --win-border: #0000000e;
        --win-drawer: #f4f4f4f7;
        --win-accent: #00783f;
        --win-accent-text: #ffffff;
        --background: var(--win-background);
        --foreground: var(--win-foreground);
        --card: var(--win-number);
        --muted-foreground: var(--win-muted);
        --border: #00000014;
        --ring: var(--win-accent);
        --primary: var(--win-accent);
        --primary-foreground: var(--win-accent-text);
        --popover: var(--win-drawer);
        --popover-foreground: var(--win-foreground);
        --calculator-curve-1: #0067c0;
        --calculator-curve-2: #d13438;
        --calculator-curve-3: #107c10;
      }
      :root.dark {
        color-scheme: dark;
        --win-background: #202020;
        --win-foreground: #ffffff;
        --win-muted: #c7c7c7;
        --win-key: #ffffff16;
        --win-number: #ffffff20;
        --win-hover: #ffffff0c;
        --win-border: #ffffff03;
        --win-drawer: #2b2b2bf5;
        --win-accent: #00f58a;
        --win-accent-text: #00351f;
        --border: #ffffff16;
        --calculator-curve-1: #70b5ff;
        --calculator-curve-2: #ff8589;
        --calculator-curve-3: #77d39a;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-width: 0;
        height: 100%;
      }
      body {
        background: var(--win-background);
        color: var(--win-foreground);
        font:
          14px/1.4 "Segoe UI Variable",
          "Segoe UI",
          "Microsoft YaHei UI",
          sans-serif;
      }
      button {
        cursor: default;
        touch-action: manipulation;
      }
      :is(button.flat, .keypad button, .converter-value):disabled {
        opacity: 1;
      }
      :is(button.flat, .keypad button, .converter-value):disabled:not(
          [data-locked="true"]
        ) {
        color: color-mix(in srgb, var(--win-foreground) 35%, transparent);
      }
      button.flat:focus-visible,
      .keypad button:focus-visible,
      .converter-value:focus-visible,
      .equation-row input:focus-visible,
      canvas:focus-visible {
        outline: 2px solid var(--win-accent);
        outline-offset: -3px;
      }
      :is(button, input, textarea, select)[data-locked="true"]:disabled {
        cursor: wait;
        opacity: 1;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        line-height: 28px;
      }
      h2 {
        font-size: 16px;
        font-weight: 600;
      }
      small,
      .muted {
        color: var(--win-muted);
      }
      main {
        position: relative;
        height: 100dvh;
        min-height: 450px;
        overflow: hidden;
        background: var(--win-background);
      }
      .calculator-header {
        display: flex;
        height: 48px;
        align-items: center;
        gap: 10px;
        padding: 0 8px;
      }
      .header-spacer {
        flex: 1;
      }
      button.flat {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--win-foreground);
        box-shadow: none;
      }
      button.flat:hover:not(:disabled) {
        background: var(--win-hover);
      }
      button.flat:active:not(:disabled) {
        background: color-mix(in srgb, var(--win-foreground) 4%, transparent);
      }
      button.icon {
        flex: none;
        width: 36px;
        min-width: 36px;
        padding: 8px;
      }
      svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        vertical-align: middle;
      }
      .workspace {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        grid-template-rows: minmax(0, 1fr);
        height: calc(100% - 48px);
        min-height: 0;
      }
      .calculator {
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 0 4px 4px;
      }
      .display {
        flex: 1 1 130px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 96px;
        max-height: 220px;
        padding: 0 16px 12px;
        overflow: hidden;
      }
      .expression {
        display: block;
        width: 100%;
        height: 28px;
        min-height: 28px;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--win-muted);
        text-align: right;
        font-size: 14px;
        box-shadow: none;
        outline-offset: 0;
      }
      .expression::placeholder {
        color: transparent;
      }
      .result {
        display: block;
        flex: none;
        min-height: 64px;
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        text-align: right;
        font-size: 46px;
        font-weight: 600;
        line-height: 1.35;
        font-variant-numeric: tabular-nums;
      }
      .result[data-length="long"] {
        font-size: 30px;
      }
      .result[data-error="true"] {
        font-size: 25px;
        white-space: normal;
        line-height: 1.2;
      }
      .mode-bar {
        display: flex;
        align-items: center;
        height: 36px;
        min-height: 36px;
        padding-left: 4px;
        gap: 8px;
      }
      .mode-bar button {
        flex: 0 0 56px;
        width: 56px;
        padding-inline: 0;
        font-size: 12px;
        font-weight: 600;
      }
      .memory {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        min-height: 36px;
        padding-bottom: 4px;
      }
      .memory button {
        padding: 0;
        font-size: 12px;
        font-weight: 600;
      }
      .function-bar {
        display: flex;
        gap: 2px;
        height: 36px;
        min-height: 36px;
        padding-bottom: 4px;
      }
      .function-bar button {
        gap: 9px;
        font-size: 12px;
        padding: 0 12px;
      }
      .chevron {
        font-size: 11px;
      }
      .keypad {
        display: grid;
        flex: 3 1 308px;
        min-height: 220px;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(7, minmax(28px, 1fr));
        gap: 2px;
      }
      .keypad button {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 28px;
        min-width: 0;
        padding: 0;
        border: 1px solid var(--win-border);
        border-bottom-color: color-mix(
          in srgb,
          var(--win-foreground) 10%,
          transparent
        );
        border-radius: 4px;
        background: var(--win-key);
        color: var(--win-foreground);
        font-size: 14px;
        font-weight: 400;
        box-shadow: none;
      }
      .keypad button.number {
        background: var(--win-number);
        font-size: 18px;
        font-weight: 600;
      }
      .keypad button:hover:not(:disabled) {
        background: var(--win-number);
      }
      .keypad button.number:hover:not(:disabled) {
        background: var(--win-key);
      }
      .keypad button:active:not(:disabled) {
        background: var(--win-hover);
        color: var(--win-muted);
      }
      .keypad button.primary {
        background: var(--win-accent);
        color: var(--win-accent-text);
        border-color: transparent;
      }
      .keypad button.primary:hover:not(:disabled) {
        background: color-mix(
          in srgb,
          var(--win-accent) 90%,
          var(--win-background)
        );
      }
      button[aria-pressed="true"] {
        box-shadow: inset 0 -2px var(--win-accent);
      }
      main[data-mode="standard"] .keypad {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        grid-template-rows: repeat(6, minmax(32px, 1fr));
      }
      main[data-mode="standard"] .mode-bar,
      main[data-mode="standard"] .function-bar {
        display: none;
      }
      .history-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        padding: 0 12px 8px;
      }
      .rail-heading {
        display: flex;
        align-items: center;
        min-height: 40px;
        flex-shrink: 0;
      }
      .rail-tabs {
        display: flex;
        flex: 1;
        align-items: center;
        min-height: 40px;
        gap: 22px;
      }
      .rail-tabs button {
        position: relative;
        font-size: 14px;
        font-weight: 600;
        padding: 0 2px;
      }
      .rail-tabs button[aria-selected="true"]::after {
        content: "";
        position: absolute;
        height: 3px;
        bottom: 0;
        width: 16px;
        left: calc(50% - 8px);
        border-radius: 2px;
        background: var(--win-accent);
      }
      #rail-close {
        display: none;
        margin-left: auto;
      }
      .rail-content {
        flex: 1 1 0;
        overflow: auto;
        min-height: 0;
        padding-top: 24px;
      }
      #history,
      #memory-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #history li {
        margin-bottom: 20px;
      }
      #history button {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        gap: 4px;
        width: 100%;
        height: auto;
        min-height: 48px;
        padding: 8px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--win-foreground);
        text-align: right;
      }
      #history button:hover {
        background: var(--win-hover);
      }
      #history span {
        color: var(--win-muted);
        font-size: 14px;
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      #history strong {
        font-size: 20px;
        font-weight: 600;
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      .memory-item {
        padding: 8px 4px;
        text-align: right;
        margin-bottom: 12px;
        border-radius: 4px;
      }
      .memory-item:hover {
        background: var(--win-hover);
      }
      .memory-value {
        display: block;
        width: 100%;
        height: auto;
        border: 0;
        background: transparent;
        color: var(--win-foreground);
        text-align: right;
        padding: 8px;
        font-size: 20px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .memory-item-actions {
        display: flex;
        justify-content: flex-end;
      }
      .memory-item-actions button {
        font-size: 12px;
        font-weight: 600;
      }
      .rail-footer {
        display: flex;
        justify-content: flex-end;
        min-height: 40px;
        flex-shrink: 0;
        padding-top: 8px;
      }
      #history-toggle {
        display: none;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background: transparent;
        z-index: 50;
      }
      .navigation-menu {
        position: absolute;
        z-index: 51;
        inset: 0 auto 0 0;
        width: min(256px, 100%);
        padding: 0 4px 8px;
        border: 1px solid var(--win-border);
        border-radius: 0 8px 8px 0;
        background: var(--win-drawer);
        box-shadow: 4px 0 24px #0003;
        backdrop-filter: blur(30px);
        display: flex;
        flex-direction: column;
      }
      .drawer-top {
        height: 48px;
        display: flex;
        align-items: center;
        padding: 0 4px;
      }
      .drawer-caption {
        color: var(--win-muted);
        font-size: 14px;
        padding: 8px 12px;
      }
      .drawer-scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .drawer-scroll > button {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 16px;
        width: 100%;
        min-height: 40px;
        height: 40px;
        padding: 0 14px;
        font-size: 14px;
        font-weight: 400;
        border-radius: 4px;
      }
      .drawer-scroll > button[aria-current="page"] {
        background: var(--win-hover);
      }
      .drawer-scroll > button[aria-current="page"]::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        height: 24px;
        width: 3px;
        border-radius: 2px;
        background: var(--win-accent);
      }
      .drawer-footer {
        margin-top: auto;
        padding-top: 8px;
        border-top: 1px solid var(--border);
      }
      .drawer-footer button {
        justify-content: flex-start;
        gap: 16px;
        width: 100%;
        height: 44px;
        font-weight: 400;
      }
      .popover {
        position: absolute;
        z-index: 45;
        min-width: 160px;
        max-width: calc(100% - 16px);
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--win-drawer);
        box-shadow: 0 8px 20px #0003;
        backdrop-filter: blur(25px);
      }
      :is(.function-popup, #bitwise-popup, #shift-popup) button {
        height: 36px;
        min-height: 36px;
      }
      .function-popup {
        left: 8px;
        top: 225px;
        width: 300px;
      }
      .trig-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
      .function-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .dialog-backdrop {
        position: absolute;
        z-index: 60;
        inset: 0;
        background: var(--surface-dialog-overlay);
        backdrop-filter: blur(var(--surface-dialog-overlay-blur));
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .confirmation,
      .settings-card {
        width: min(460px, 100%);
        padding: 1rem;
      }
      .confirmation p {
        margin: 16px 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 0;
        border-bottom: 1px solid var(--border);
      }
      .settings-card details {
        margin-top: 16px;
      }
      .settings-card details p {
        margin: 12px 0;
        color: var(--win-muted);
      }
      .settings-card header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .settings-card .row {
        margin-top: 12px;
      }
      #artifacts {
        position: absolute;
        z-index: 43;
        left: 12px;
        bottom: 8px;
        max-width: calc(100% - 24px);
      }
      #artifacts:empty {
        display: none;
      }
      #artifacts button {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        background: var(--win-drawer);
      }
      .graph-panel {
        position: relative;
        min-width: 0;
        height: 100%;
      }
      .canvas-wrap {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      .graph-floats {
        position: absolute;
        z-index: 2;
        top: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
      }
      .graph-floats button,
      .graph-zooms button {
        background: var(--win-drawer);
      }
      .graph-zooms {
        position: absolute;
        z-index: 2;
        right: 8px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .coordinates {
        position: absolute;
        bottom: 0;
        left: 12px;
        height: 20px;
        font-size: 12px;
        color: var(--win-muted);
        pointer-events: none;
      }
      .legend {
        display: none;
      }
      .graph-settings {
        top: 48px;
        right: 8px;
        width: 280px;
      }
      .ranges {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 8px;
      }
      .ranges label {
        display: grid;
        gap: 4px;
        min-width: 0;
        font-size: 12px;
      }
      .ranges input {
        min-width: 0;
        width: 100%;
      }
      .graph-settings .row {
        padding: 8px;
      }
      .graph-input-pane {
        display: none;
        flex: 1 1 130px;
        min-height: 120px;
        overflow: auto;
      }
      .equation-row {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr) 28px 28px;
        gap: 4px;
        align-items: center;
        padding: 6px;
        border-bottom: 1px solid var(--border);
      }
      .equation-row input {
        min-width: 0;
        width: 100%;
        border: 0;
        border-bottom: 1px solid transparent;
        border-radius: 0;
        background: transparent;
        padding: 4px;
        height: 36px;
      }
      .equation-row input:focus {
        border-bottom-color: var(--win-accent);
      }
      .equation-row button {
        padding: 0;
        width: 28px;
        min-width: 28px;
      }
      .equation-row .curve-toggle {
        width: 36px;
        font-size: 16px;
        font-weight: 600;
      }
      .equation-tools {
        display: flex;
        justify-content: space-between;
        padding: 4px 8px;
      }
      .analysis-panel {
        padding: 12px;
      }
      .analysis-panel label {
        display: grid;
        gap: 4px;
        margin: 8px 0;
      }
      .analysis-panel input,
      .analysis-panel select {
        width: 100%;
        min-width: 0;
      }
      #graph-view,
      #graph-input {
        display: none;
      }
      main[data-mode="graph"] .workspace {
        grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
      }
      main[data-mode="graph"] .calculator {
        grid-column: 2;
        grid-row: 1;
        border-left: 1px solid var(--border);
      }
      main[data-mode="graph"] .graph-panel {
        grid-column: 1;
        grid-row: 1;
      }
      main[data-mode="graph"] .display,
      main[data-mode="graph"] .memory,
      main[data-mode="graph"] .mode-bar,
      main[data-mode="graph"] .history-panel {
        display: none;
      }
      main[data-mode="graph"] .graph-input-pane {
        display: block;
      }
      main[data-mode="graph"] .keypad {
        flex: 1 1 350px;
        max-height: 400px;
        min-height: 220px;
      }
      .programmer-panel {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        height: 100%;
        padding: 0 4px 4px;
      }
      .prog-display {
        flex: 1 1 85px;
        min-height: 70px;
        max-height: 150px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 0 16px 8px;
      }
      #prog-expression {
        text-align: right;
        height: 24px;
        color: var(--win-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #radix-values {
        padding: 0 4px 8px;
      }
      #radix-values button {
        display: grid;
        position: relative;
        grid-template-columns: 48px minmax(0, 1fr);
        width: 100%;
        justify-content: start;
        height: 30px;
        min-height: 30px;
        padding: 0 8px;
        text-align: left;
        gap: 8px;
        font-size: 13px;
      }
      #radix-values button span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      #radix-values button[aria-pressed="true"] {
        box-shadow: none;
      }
      #radix-values button[aria-pressed="true"]::before {
        content: "";
        position: absolute;
        left: 0;
        top: 7px;
        bottom: 7px;
        width: 3px;
        border-radius: 2px;
        background: var(--win-accent);
      }
      .prog-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 36px;
      }
      .prog-toolbar .row {
        gap: 0;
      }
      .prog-toolbar button {
        font-size: 12px;
        font-weight: 600;
      }
      #prog-input-area {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 36px minmax(0, 1fr);
        flex: 3 1 344px;
        min-width: 0;
        min-height: 256px;
      }
      #prog-function-bar {
        grid-column: 1;
        grid-row: 1;
      }
      #prog-keypad {
        grid-column: 1;
        grid-row: 2;
        min-height: 0;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(6, minmax(28px, 1fr));
      }
      #bit-grid {
        grid-column: 1;
        grid-row: 1 / 3;
        display: grid;
        grid-template-columns: repeat(16, minmax(0, 1fr));
        grid-template-rows: repeat(4, minmax(44px, 1fr));
        min-width: 0;
        gap: 12px 1px;
        padding: 8px 0;
      }
      #bit-grid button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: 100%;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--win-foreground);
        border-radius: 4px;
        font-size: 17px;
      }
      #bit-grid button:nth-child(4n) {
        margin-right: 5px;
      }
      #bit-grid small {
        height: 16px;
        font-size: 9px;
      }
      #bit-grid button[aria-pressed="true"] {
        color: var(--win-accent);
        box-shadow: none;
      }
      #bitwise-popup {
        width: 280px;
      }
      #shift-popup {
        display: grid;
        width: 235px;
      }
      #shift-popup button {
        justify-content: flex-start;
      }
      .date-panel {
        overflow: auto;
        padding: 8px 16px 24px;
      }
      .date-content {
        width: 100%;
        max-width: 456px;
      }
      #date-operation {
        min-width: min(276px, 100%);
        max-width: 100%;
        border: 0;
        background: transparent;
        padding-left: 0;
      }
      .date-field {
        margin-top: 24px;
      }
      .date-field label {
        display: block;
        color: var(--win-muted);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .date-picker {
        display: flex;
        justify-content: space-between;
        width: min(296px, 100%);
        min-height: 36px;
        padding: 0 8px 0 0;
      }
      .date-picker span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .date-offset-direction {
        display: flex;
        gap: 20px;
        margin-top: 24px;
      }
      .date-offset-direction label {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 80px;
      }
      .date-offset-direction input {
        accent-color: var(--win-accent);
        width: 18px;
        height: 18px;
      }
      .date-offsets {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        max-width: 320px;
        margin-top: 28px;
      }
      .date-offsets label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        color: var(--win-muted);
      }
      .date-offsets input {
        width: 100%;
        min-width: 0;
      }
      .date-result-block {
        margin-top: 28px;
      }
      .date-result-block > span {
        color: var(--win-muted);
        font-size: 12px;
      }
      #date-result {
        display: block;
        margin-top: 4px;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.5;
      }
      #date-total {
        margin-top: 8px;
        color: var(--win-muted);
      }
      .calendar-popup {
        width: min(320px, calc(100% - 16px));
        padding: 12px;
      }
      .calendar-heading {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 12px;
      }
      .calendar-heading select {
        flex: 1;
        min-width: 0;
      }
      .calendar-heading button {
        padding: 0;
        width: 2rem;
      }
      #calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 2px;
      }
      .calendar-row {
        display: contents;
      }
      #calendar-grid span {
        text-align: center;
        font-size: 12px;
        height: 26px;
        color: var(--win-muted);
      }
      #calendar-grid button {
        height: 34px;
        min-height: 34px;
        padding: 0;
        border-radius: 50%;
      }
      #calendar-grid button[aria-selected="true"] {
        background: var(--win-accent);
        color: var(--win-accent-text);
      }
      #calendar-grid button.outside {
        color: var(--win-muted);
      }
      .converter-panel {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows:
          minmax(56px, 56fr) minmax(32px, 32fr)
          minmax(56px, 56fr) minmax(32px, 32fr)
          minmax(48px, auto) minmax(220px, 272fr);
        width: 100%;
        height: 100%;
        min-width: 0;
        overflow: hidden;
      }
      .converter-value {
        display: flex;
        align-items: flex-end;
        justify-content: flex-start;
        gap: 8px;
        width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
        padding: 0 16px 4px;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--win-foreground);
        text-align: left;
        font-weight: 300;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
      }
      .converter-value[aria-pressed="true"] {
        font-weight: 600;
        box-shadow: none;
      }
      .converter-value output {
        display: block;
        min-width: 0;
        padding: 0;
        border-radius: 0;
        overflow: hidden;
        font-size: 40px;
        font-weight: inherit;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .converter-value[data-length="long"] output {
        font-size: 26px;
      }
      .converter-symbol {
        flex: none;
        padding-bottom: 8px;
        font-size: 20px;
        font-weight: 300;
      }
      .converter-unit {
        display: flex;
        align-items: flex-start;
        min-width: 0;
        padding: 0 12px;
      }
      .converter-unit select {
        width: fit-content;
        max-width: 100%;
        height: 32px;
        min-height: 32px;
        padding: 0 28px 0 4px;
        border: 1px solid transparent;
        border-radius: 4px;
        background-color: transparent;
        box-shadow: none;
        font-weight: 400;
        text-overflow: ellipsis;
      }
      .converter-unit select:hover:not(:disabled) {
        background-color: var(--win-hover);
      }
      .converter-unit select option {
        color: var(--win-foreground);
        background: var(--win-drawer);
      }
      .converter-supplementary {
        min-width: 0;
        min-height: 48px;
        overflow: hidden;
        padding: 0 16px 6px;
      }
      .converter-equivalent-heading {
        display: block;
        color: var(--win-muted);
        font-size: 12px;
        line-height: 18px;
      }
      #converter-equivalents {
        display: flex;
        align-items: baseline;
        gap: 24px;
        min-height: 27px;
        max-height: 27px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
      }
      #converter-equivalents > span {
        display: inline-flex;
        align-items: baseline;
        flex: none;
        gap: 4px;
      }
      #converter-equivalents strong {
        font-size: 16px;
        font-weight: 400;
      }
      #converter-equivalents small {
        font-size: 14px;
      }
      .currency-info {
        font-size: 12px;
        line-height: 18px;
      }
      #currency-rate,
      #currency-date {
        color: var(--win-muted);
      }
      #currency-date[data-stale="true"],
      #currency-status[data-error="true"] {
        color: light-dark(#c42b1c, #ff99a4);
      }
      #currency-date[data-stale="true"] {
        font-weight: 600;
        color: #c42b1c;
      }
      :root.dark #currency-date[data-stale="true"] {
        color: #ff99a4;
      }
      .currency-refresh-line {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 3px;
        padding-top: 4px;
      }
      .currency-info button,
      .currency-info a {
        min-height: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        color: var(--win-accent);
        font: inherit;
        text-decoration: none;
      }
      .currency-info button:hover:not(:disabled),
      .currency-info a:hover {
        text-decoration: underline;
      }
      #currency-source {
        display: block;
        width: fit-content;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .converter-panel .converter-keypad {
        grid-row: 6;
        grid-column: 1;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(5, minmax(28px, 1fr));
        flex: none;
        min-height: 0;
        margin: 0 4px 4px;
      }
      .converter-keypad button.number {
        font-weight: 400;
      }
      #converter-negate {
        grid-area: 5 / 1;
        font-size: 16px;
      }
      #converter-zero {
        grid-area: 5 / 2;
      }
      #converter-decimal {
        grid-area: 5 / 3;
      }
      main[data-mode="converter"] .workspace {
        display: block;
      }
      main[data-mode="converter"] .calculator,
      main[data-mode="converter"] .history-panel {
        display: none;
      }
      @media (min-aspect-ratio: 1/1) {
        .converter-panel {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          grid-template-rows:
            minmax(56px, 4fr) minmax(32px, 2fr)
            minmax(56px, 4fr) minmax(32px, 2fr)
            minmax(48px, 2fr);
        }
        .converter-panel > :not(.converter-keypad) {
          grid-column: 1;
        }
        .converter-panel .converter-keypad {
          grid-row: 1 / 6;
          grid-column: 2;
          margin-left: 3px;
        }
      }
      @media (min-width: 640px) {
        .converter-value {
          padding-bottom: 12px;
        }
        .converter-value output {
          font-size: 46px;
        }
        .converter-symbol {
          padding-bottom: 17px;
          font-size: 32px;
        }
        .converter-unit select {
          height: 44px;
        }
        .converter-keypad button.number {
          font-size: 28px;
        }
      }
      @media (min-width: 1280px) and (min-height: 768px) {
        .converter-keypad button.number {
          font-size: 46px;
        }
        .converter-keypad button:not(.number) {
          font-size: 24px;
        }
      }
      @media (max-height: 560px) and (max-aspect-ratio: 1/1) {
        .converter-panel {
          grid-template-rows:
            minmax(56px, 56fr) minmax(32px, 32fr)
            minmax(56px, 56fr) minmax(32px, 32fr)
            minmax(48px, auto) minmax(160px, 272fr);
        }
      }
      main[data-mode="programmer"] .calculator,
      main[data-mode="date"] .calculator {
        display: none;
      }
      main[data-mode="date"] .workspace {
        display: block;
      }
      main[data-mode="date"] .history-panel {
        display: none;
      }
      main[data-mode="programmer"] #history-tab {
        display: none;
      }
      main[data-mode="programmer"] #history-content {
        display: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      [aria-invalid="true"] {
        border-color: #c42b1c;
      }
      @media (min-height: 800px) {
        .result {
          font-size: 72px;
          min-height: 80px;
        }
      }
      @media (max-height: 600px) {
        .result {
          font-size: 32px;
          min-height: 44px;
        }
        .display {
          min-height: 70px;
          padding-bottom: 4px;
        }
        .prog-display {
          min-height: 54px;
        }
        #radix-values button {
          min-height: 25px;
          height: 25px;
        }
      }
      @media (max-width: 720px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr);
        }
        .history-panel {
          display: none;
        }
        #history-toggle {
          display: inline-flex;
        }
        main[data-rail-open="true"] .history-panel {
          display: flex;
          position: absolute;
          z-index: 42;
          inset: auto 0 0;
          height: min(65dvh, 450px);
          border-top: 1px solid var(--border);
          border-radius: 8px 8px 0 0;
          background: var(--win-drawer);
          box-shadow: 0 -8px 28px #0003;
          backdrop-filter: blur(25px);
        }
        #rail-close {
          display: inline-flex;
        }
      }
      @media (max-width: 799px) {
        main[data-mode="graph"] .workspace {
          grid-template-columns: minmax(0, 1fr);
        }
        main[data-mode="graph"] .calculator,
        main[data-mode="graph"] .graph-panel {
          grid-column: 1;
        }
        main[data-mode="graph"][data-graph-tab="plot"] .calculator {
          display: none;
        }
        main[data-mode="graph"][data-graph-tab="input"] .graph-panel {
          display: none;
        }
        main[data-mode="graph"] #graph-view,
        main[data-mode="graph"] #graph-input {
          display: inline-flex;
        }
      }
      @media (max-width: 479px) {
        #date-result {
          font-size: 16px;
        }
        .drawer-scroll > button {
          font-size: 16px;
        }
      }
      @media (forced-colors: active) {
        .keypad button {
          border: 1px solid ButtonText;
        }
        button[aria-pressed="true"],
        button[aria-selected="true"] {
          border: 2px solid Highlight;
        }
        .navigation-menu {
          background: Canvas;
        }
      }
    </style>
  </head>
  <body>
    <main data-mode="standard" data-rail-open="false" data-graph-tab="plot">
      <header class="calculator-header">
        <button
          id="navigation"
          class="flat icon"
          aria-expanded="false"
          aria-controls="navigation-menu"
          data-help-label="navigation"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <h1 id="calculate-heading" data-i18n="standard">标准</h1>
        <button
          id="always-on-top"
          class="flat icon"
          aria-pressed="false"
          data-help-label="alwaysOnTop"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14 3h7v7M21 3l-9 9M11 4H4v16h16v-7" />
          </svg>
        </button>
        <span class="header-spacer"></span>
        <button id="graph-view" class="flat icon" data-help-label="graphView">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 3v18h18M5 15l5-6 4 3 6-8M5 19l6-5 4 2 5-2" />
          </svg>
        </button>
        <button id="graph-input" class="flat icon" data-help-label="graphInput">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="2" width="14" height="20" rx="2" />
            <path
              d="M8 5h8v4H8zM8 12h1m3 0h1m3 0h0M8 15h1m3 0h1m3 0h0M8 18h1m3 0h1m3 0h0"
            />
          </svg>
        </button>
        <button
          id="history-toggle"
          class="flat icon"
          data-help-label="history"
          aria-controls="history-panel"
          aria-expanded="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11a9 9 0 1 1 2.5 7M3 4v7h7M12 7v5l3 2" />
          </svg>
        </button>
      </header>
      <div class="workspace">
        <section
          id="calculator-panel"
          class="calculator"
          aria-labelledby="calculate-heading"
        >
          <div class="display">
            <output
              id="expression-line"
              class="expression"
              aria-live="off"
            ></output
            ><input
              id="expression"
              type="text"
              maxlength="4096"
              hidden
              aria-label="表达式"
            />
            <output
              id="result"
              class="result"
              aria-live="polite"
              aria-atomic="true"
              >0</output
            >
          </div>
          <div id="graph-input-pane" class="graph-input-pane">
            <div id="equations"></div>
            <div class="equation-tools">
              <button
                id="add-equation"
                class="flat"
                data-help-label="addEquation"
              >
                ＋</button
              ><button class="flat" data-action="plot" data-i18n="plot">
                绘制</button
              ><button id="analysis-toggle" class="flat" data-i18n="analysis">
                分析
              </button>
            </div>
            <section id="analysis-panel" class="analysis-panel" hidden>
              <label
                ><span data-i18n="selectedCurve">函数</span
                ><select id="curve">
                  <option value="0">f1</option>
                  <option value="1">f2</option>
                  <option value="2">f3</option>
                  <option value="3">f4</option>
                  <option value="4">f5</option>
                  <option value="5">f6</option>
                  <option value="6">f7</option>
                  <option value="7">f8</option>
                </select></label
              >
              <div class="ranges">
                <label>a<input id="a" inputmode="decimal" /></label
                ><label>b<input id="b" inputmode="decimal" /></label>
              </div>
              <div class="row">
                <button
                  data-variant="ghost"
                  data-action="root"
                  data-i18n="root"
                >
                  求根</button
                ><button
                  data-variant="ghost"
                  data-action="integrate"
                  data-i18n="integrate"
                >
                  积分
                </button>
              </div>
              <output id="analysis-result" aria-live="polite"></output>
            </section>
          </div>
          <div class="mode-bar">
            <button id="angle-cycle" class="flat">DEG</button
            ><button
              id="notation"
              class="flat"
              aria-pressed="false"
              data-help-label="notation"
            >
              F-E
            </button>
          </div>
          <div class="memory">
            <button class="flat" data-action="memory-clear">MC</button
            ><button id="recall" class="flat">MR</button
            ><button class="flat" data-action="memory-add">M+</button
            ><button class="flat" data-action="memory-subtract">M−</button
            ><button class="flat" data-action="memory-store">MS</button
            ><button
              id="memory-toggle"
              class="flat"
              data-help-label="memoryTitle"
            >
              M⌄
            </button>
          </div>
          <div class="function-bar">
            <button
              id="trig-menu"
              class="flat"
              aria-expanded="false"
              aria-controls="trig-popup"
            >
              <span>◿</span><span data-i18n="trigonometry">三角学</span
              ><span class="chevron">⌄</span></button
            ><button
              id="functions-menu"
              class="flat"
              aria-expanded="false"
              aria-controls="functions-popup"
            >
              <span>ƒ</span><span data-i18n="functionMenu">函数</span
              ><span class="chevron">⌄</span>
            </button>
          </div>
          <div
            id="keypad"
            class="keypad"
            role="group"
            aria-label="计算键盘"
          ></div>
        </section>
        <section
          id="graph-panel"
          class="graph-panel"
          aria-labelledby="calculate-heading"
          hidden
        >
          <div class="canvas-wrap">
            <canvas
              id="graph"
              tabindex="0"
              role="img"
              aria-label="函数图像"
              aria-describedby="graph-summary graph-help"
            ></canvas>
          </div>
          <div class="graph-floats">
            <button
              id="graph-settings-toggle"
              class="flat icon"
              data-help-label="graphSettings"
              aria-expanded="false"
              aria-controls="graph-settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="m10 3 4 0 .7 3 2 .9 2.8-.9 2 3.5-2.2 2.1v2.3l2.2 2.1-2 3.5-2.8-.9-2 .9-.7 3h-4l-.7-3-2-.9-2.8.9-2-3.5 2.2-2.1v-2.3L2.5 9.5l2-3.5 2.8.9 2-.9Z"
                />
                <circle cx="12" cy="13" r="3" />
              </svg>
            </button>
          </div>
          <div class="graph-zooms">
            <button id="zoom-in" class="flat icon" data-help-label="zoomIn">
              ＋</button
            ><button id="zoom-out" class="flat icon" data-help-label="zoomOut">
              −</button
            ><button
              id="fit"
              class="flat icon"
              data-action="fit-plot"
              data-help-label="fit"
            >
              ⌖</button
            ><button
              class="flat icon"
              data-action="reset-plot"
              data-help-label="reset"
            >
              ↺
            </button>
          </div>
          <div id="graph-settings" class="popover graph-settings" hidden>
            <div class="ranges">

          { once: true },
        );
        document.querySelectorAll("button").forEach((button) => {
          button.type = "button";
          if (!button.classList.contains("primary"))
            button.dataset.variant = "outline";
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            for (const help of document.querySelectorAll(".help"))
              if (
                help.matches(":hover") ||
                help.contains(document.activeElement)
              ) {
                help.dataset.dismissed = "true";
                event.preventDefault();
              }
          }
          if (event.key === "Escape" && !$("load-confirm").hidden) {
            event.preventDefault();
            $("load-cancel").click();
          }
        });
        document.addEventListener("keydown", (event) => {
          if (event.defaultPrevented || event.isComposing || busy()) return;
          if (event.key === "Escape") {
            if (!$("calendar-popup").hidden) {
              closeCalendar();
              event.preventDefault();
              return;
            }
            if (!$("settings-dialog").hidden) {
              $("settings-close").click();
              event.preventDefault();
              return;
            }
            if (!$("graph-settings").hidden) {
              $("graph-settings-close").click();
              event.preventDefault();
              return;
            }
            if (popupPairs.some(([, popup]) => !$(popup).hidden)) {
              closePopups(true);
              event.preventDefault();
              return;
            }
            if (main.dataset.railOpen === "true") {
              $("rail-close").click();
              event.preventDefault();
              return;
            }
          }
          if (!$("load-confirm").hidden) return;
          if (
            !$("settings-dialog").hidden ||
            !$("calendar-popup").hidden ||
            !$("navigation-menu").hidden
          )
            return;
          if (
            event.altKey &&
            !event.ctrlKey &&
            !event.metaKey &&
            /^[1-5]$/.test(event.key)
          ) {
            event.preventDefault();
            setMode(
              {
                1: "standard",
                2: "scientific",
                3: "programmer",
                4: "date",
                5: "graph",
              }[event.key],
            );
            return;
          }
          if (event.ctrlKey && !event.altKey && !event.metaKey) {
            if (event.key.toLowerCase() === "e") {
              event.preventDefault();
              setMode("date");
              return;
            }
            if (calculatorMode === "converter") return;
            const shortcut = {
              m: "memory-store",
              p: "memory-add",
              q: "memory-subtract",
              l: "memory-clear",
            }[event.key.toLowerCase()];
            if (shortcut) {
              event.preventDefault();
              document.querySelector(`[data-action="${shortcut}"]`).click();
            }
            if (event.key.toLowerCase() === "r") {
              event.preventDefault();
              $("recall").click();
            }
            if (event.key.toLowerCase() === "h") {
              event.preventDefault();
              selectRail("history", true);
            }
            return;
          }
          if (event.altKey || event.ctrlKey || event.metaKey) return;
          if (calculatorMode === "converter") {
            if (
              ["INPUT", "TEXTAREA", "SELECT", "SUMMARY"].includes(
                event.target?.tagName,
              )
            )
              return;
            const key = /^\d$/.test(event.key)
              ? event.key
              : {
                  ".": ".",
                  ",": ".",
                  Backspace: "backspace",
                  Delete: "clear-entry",
                  Escape: "clear-entry",
                  F9: "negate",
                }[event.key];
            if (key) {
              event.preventDefault();
              converterKey(key);
            }
            return;
          }
          if (["F3", "F4", "F5"].includes(event.key)) {
            event.preventDefault();
            $("angle").value = { F3: "deg", F4: "rad", F5: "grad" }[event.key];
            checkpoint();
            renderDisplay();
            return;
          }
          if (calculatorMode === "date") return;
          if (
            event.key === "F9" ||
            (event.key === "=" && event.target === $("expression"))
          ) {
            event.preventDefault();
            handleKey(event.key === "F9" ? "sign" : "equals");
            return;
          }
          if (
            ["INPUT", "TEXTAREA", "SELECT", "SUMMARY"].includes(
              event.target?.tagName,
            )
          )
            return;
          if (popupPairs.some(([, popup]) => !$(popup).hidden)) return;
          const mapped = {
            Enter: "equals",
            "=": "equals",
            "+": "add",
            "-": "subtract",
            "*": "multiply",
            "/": "divide",
            "%": calculatorMode === "standard" ? "percent" : "mod",
            "^": "power",
            "(": "open",
            ")": "close",
            ".": "decimal",
            ",": "decimal",
            Backspace: "backspace",
            Delete: "clear-entry",
            F9: "sign",
            "!": "factorial",
          }[event.key];
          if (event.key === "Escape") {
            event.preventDefault();
            if (calculatorMode === "standard") clearStandard();
            else if (calculatorMode === "programmer")
              handleProgrammerKey("clear-all");
            else clearCalculator();
          } else if (mapped || /^\d$/.test(event.key)) {
            event.preventDefault();
            handleKey(mapped ?? event.key);
          } else if (
            calculatorMode === "programmer" &&
            /^[a-f]$/i.test(event.key)
          ) {
            event.preventDefault();
            handleProgrammerKey(event.key.toUpperCase());
          }
        });
        document.querySelectorAll(".help").forEach((help) => {
          for (const name of ["pointerenter", "focusin"])
            help.addEventListener(name, () => delete help.dataset.dismissed);
          for (const name of ["pointerleave", "focusout"])
            help.addEventListener(name, () => {
              if (!help.contains(document.activeElement))
                delete help.dataset.dismissed;
            });
        });
        starter.onChange((snapshot) => {
          if (disposed) return;
          hostSnapshotSerial++;
          if (current?.busy && !snapshot.busy)
            completedBusySerial = hostSnapshotSerial;
          if (awaitIdleSnapshot && !snapshot.busy) awaitIdleSnapshot = false;
          const checkpointKey = JSON.stringify(snapshot.checkpoint ?? null);
          // Host session imports can replace a live document. Local input owns its
          // draft until that explicit checkpoint replacement or a completed action.
          if (
            hydrated &&
            !working &&
            checkpointKey !== lastCheckpoint &&
            !ownedCheckpoints.has(checkpointKey)
          ) {
            clearTimeout(draftTimer);
            draftTimer = undefined;
            draftEpoch++;
            draftDeferred = false;
            conflictRetriedRevision = -1;
            awaitIdleSnapshot = false;
            localDraft = false;
            hydrated = false;
            restoredCalculator = false;
            displayValue = null;
            // Recovery fields may be present without calculator-specific state.
            // Start a new workspace before restoring its optional substructures.
            standard = blankStandard();
            modeSessions = {};
            converterSessions = {};
            scientificNotation = false;
            replaceEntry = false;
            entryCleared = false;
            repeatOperation = null;
            programmerEntry = "0";
            programmerFormula = "";
            programmerReplace = true;
            programmerWaiting = false;
            programmerBitView = false;
            shiftKind = "arithmetic";
            converterSide = "from";
            converterReplace = true;
            graphInputTab = "plot";
            equationVisibility = [];
            equationStyles = [];
            renderedEquations = null;
            resetTopState();
          }
          lastCheckpoint = checkpointKey;
          current = snapshot;
          render();
        });
      })();
    </script>
  </body>
</html>
