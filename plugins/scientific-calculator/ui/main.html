<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>科学计算器</title>
    <style>
      :root {
        --calculator-curve-1: #2563eb;
        --calculator-curve-2: #c2410c;
        --calculator-curve-3: #0f766e;
      }
      :root.dark {
        --calculator-curve-1: #60a5fa;
        --calculator-curve-2: #fb923c;
        --calculator-curve-3: #2dd4bf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
      }
      main {
        max-width: 1180px;
        padding: 1.25rem;
        margin: auto;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        letter-spacing: -0.03em;
      }
      h2 {
        margin: 0 0 0.8rem;
        font-size: 1.05rem;
      }
      p {
        margin: 0.4rem 0;
      }
      .muted,
      small {
        color: var(--muted-foreground);
      }
      header,
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.65rem;
        flex-wrap: wrap;
      }
      header {
        position: relative;
        margin-bottom: 1rem;
      }
      .analysis-actions {
        position: relative;
      }
      .analysis-actions > .help,
      #storage-help {
        position: static;
      }
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(230px, 1fr);
        gap: 1rem;
      }
      .panel {
        min-width: 0;
        padding: 1rem;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: var(--card);
      }
      .stack {
        display: grid;
        align-content: start;
        gap: 0.8rem;
      }
      label {
        display: grid;
        gap: 0.3rem;
        min-width: 0;
        font-size: 0.875rem;
      }
      input,
      select,
      textarea {
        max-width: 100%;
        min-width: 0;
      }
      [data-locked="true"]:disabled {
        opacity: 1;
        cursor: wait;
      }
      button.primary {
        color: var(--primary-foreground);
        background: var(--primary);
        border-color: var(--primary);
      }
      button.primary:hover:not(:disabled) {
        opacity: 0.9;
        background: var(--primary);
      }
      :focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
      }
      .expression {
        font:
          1.25rem/1.5 ui-monospace,
          monospace;
      }
      .result {
        display: block;
        height: 3.2rem;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font:
          2rem/1.5 ui-monospace,
          monospace;
        text-align: right;
      }
      .keypad {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 0.4rem;
      }
      .keypad button {
        min-height: 2.5rem;
        padding: 0.35rem 0.1rem;
        font-size: 0.875rem;
      }
      .keypad button[data-special="clear"] {
        color: var(--destructive);
      }
      .memory {
        gap: 0.4rem;
        justify-content: flex-start;
      }
      .memory output {
        margin-left: auto;
        min-width: 0;
        font-size: 0.8rem;
        font-family: ui-monospace, monospace;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #history {
        max-height: 20rem;
        overflow: auto;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #history li + li {
        border-top: 1px solid var(--border);
      }
      #history button,
      .history-entry {
        width: 100%;
        border: 0;
        border-radius: 0;
        padding: 0.65rem 0.2rem;
        text-align: left;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 1.2rem 1.4rem;
        height: 4rem;
        justify-content: stretch;
        gap: 0.2rem;
        background: transparent;
      }
      #history strong {
        font-family: ui-monospace, monospace;
      }
      #history strong,
      #history span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #history span {
        font-size: 0.8rem;
      }
      .graph-panel {
        margin-top: 1rem;
      }
      .graph-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 240px;
        gap: 1rem;
      }
      .graph-layout > * {
        min-width: 0;
      }
      .canvas-wrap {
        position: relative;
        height: 390px;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        overflow: hidden;
        background: var(--background);
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      .coordinates {
        font:
          0.8rem/1.5 ui-monospace,
          monospace;
        height: 1.5rem;
        line-height: 1.5rem;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .ranges {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
      }
      .ranges input {
        padding: 0.4rem;
      }
      .tools {
        border-top: 1px solid var(--border);
        padding-top: 0.75rem;
      }
      .legend {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        height: 1.5rem;
        gap: 0.8rem;
        font-size: 0.8rem;
        margin-top: 0.5rem;
      }
      .legend span {
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .dot {
        display: inline-block;
        width: 0.65rem;
        height: 0.65rem;
        border-radius: 50%;
        margin-right: 0.4rem;
      }
      [aria-invalid="true"] {
        border-color: var(--destructive);
      }
      .footer {
        font-size: 0.875rem;
      }
      .confirmation {
        margin: 0 0 1rem;
        padding: 0.8rem 1rem;
        border: 1px solid var(--ring);
        border-radius: var(--radius, 0.625rem);
      }
      .confirmation[hidden] {
        display: none;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .graph-tools {
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr) auto;
        margin-bottom: 0.5rem;
      }
      .graph-tools > button {
        width: 2rem;
        padding: 0;
      }
      .graph-actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-auto-rows: minmax(2rem, auto);
        align-items: stretch;
        gap: 0.65rem;
        max-width: 100%;
      }
      .graph-actions > button {
        min-width: 0;
        min-height: 2rem;
        padding: 0.25rem 0.625rem;
        line-height: 1.25rem;
        white-space: normal;
      }
      #graph-status {
        height: 1.4em;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      #artifacts {
        justify-content: flex-start;
      }
      #artifacts:not(:empty) {
        margin-top: 1rem;
      }
      .help {
        position: relative;
        display: inline-flex;
        flex: none;
      }
      .help[hidden] {
        display: none;
      }
      .help::before {
        content: "";
        position: absolute;
        inset: auto 0 100%;
        height: 0.5rem;
      }
      button.help-trigger {
        width: 1.6rem;
        min-height: 1.6rem;
        padding: 0;
        border-radius: 50%;
        color: var(--muted-foreground);
      }
      .help-text {
        display: none;
        position: absolute;
        z-index: 10;
        right: 0;
        bottom: calc(100% + 0.5rem);
        width: min(21rem, calc(100vw - 3rem));
        padding: 0.65rem 0.8rem;
        border: 1px solid var(--border);
        border-radius: var(--radius, 0.625rem);
        background: var(--popover, var(--card));
        color: var(--popover-foreground, var(--foreground));
        font-size: 0.8rem;
        line-height: 1.5;
        white-space: normal;
        text-align: left;
        box-shadow: 0 4px 12px #0002;
      }
      .help:hover .help-text,
      .help:focus-within .help-text {
        display: block;
      }
      .help[data-dismissed="true"] .help-text {
        display: none;
      }
      .help.align-start .help-text {
        left: 0;
        right: auto;
      }
      .help.below .help-text {
        top: calc(100% + 0.5rem);
        bottom: auto;
      }
      .help.below::before {
        inset: 100% 0 auto;
      }
      #artifacts > button {
        display: block;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      details {
        margin-top: 0.8rem;
        font-size: 0.875rem;
      }
      summary {
        cursor: pointer;
      }
      code {
        font-family: ui-monospace, monospace;
      }
      @media (max-width: 760px) {
        .workspace,
        .graph-layout {
          grid-template-columns: 1fr;
        }
        .canvas-wrap {
          height: 320px;
        }
        main {
          padding: 0.75rem;
        }
        .graph-controls {
          display: grid;
          grid-template-columns: 1fr 1fr;
          align-items: start;
          gap: 0.75rem;
        }
        .graph-controls > label:first-child {
          grid-column: 1 / -1;
        }
      }
      @media (max-width: 430px) {
        .graph-actions {
          width: 100%;
        }
        .graph-controls {
          grid-template-columns: 1fr;
        }
        .keypad {
          gap: 0.25rem;
        }
        .panel {
          padding: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1 data-i18n="title">科学计算器</h1>
        </div>
        <div class="row header-actions">
          <button data-action="save" data-i18n="save">保存工作区</button
          ><button id="load" data-i18n="load">载入</button>
          <span id="storage-help" class="help below" hidden>
            <button
              class="help-trigger"
              data-help-label="storageHelp"
              aria-describedby="storage-hint"
            >
              ?
            </button>
            <span
              id="storage-hint"
              class="help-text"
              role="tooltip"
              data-i18n="noStorage"
            ></span>
          </span>
        </div>
      </header>
      <section
        id="load-confirm"
        class="confirmation"
        role="region"
        aria-labelledby="load-confirm-title"
        hidden
      >
        <h2 id="load-confirm-title" data-i18n="loadTitle">
          载入保存的工作区？
        </h2>
        <p data-i18n="loadConfirm">
          载入保存的工作区会替换当前会话，请先导出需要保留的记录。
        </p>
        <div class="row">
          <button id="load-cancel" data-i18n="cancel">取消</button
          ><button
            id="load-confirm-button"
            class="primary"
            data-i18n="confirmLoad"
          >
            确认载入
          </button>
        </div>
      </section>
      <div class="workspace">
        <section class="panel stack" aria-labelledby="calculate-heading">
          <div class="row">
            <h2 id="calculate-heading" data-i18n="calculate">计算</h2>
            <label
              ><span class="sr-only" data-i18n="angle">角度制</span
              ><select id="angle" aria-label="角度制">
                <option value="rad">RAD</option>
                <option value="deg">DEG</option>
              </select></label
            >
          </div>
          <label
            ><span data-i18n="expression">表达式</span
            ><input
              id="expression"
              class="expression"
              type="text"
              maxlength="4096"
              spellcheck="false"
              autocomplete="off"
              aria-describedby="syntax-hint error"
          /></label>
          <output id="result" class="result" aria-live="polite">0</output>
          <div class="row memory">
            <button data-action="memory-store">MS</button
            ><button data-action="memory-add">M+</button
            ><button id="recall">MR</button
            ><button data-action="memory-clear">MC</button
            ><output id="memory">M = 0</output>
          </div>
          <div id="keypad" class="keypad"></div>
          <div class="row">
            <span class="help align-start">
              <button
                class="help-trigger"
                data-help-label="syntaxHelp"
                aria-describedby="syntax-hint"
              >
                ?
              </button>
              <span
                id="syntax-hint"
                class="help-text"
                role="tooltip"
                data-i18n="syntax"
              ></span>
            </span>
            <button class="primary" data-action="calculate" data-i18n="equals">
              计算 =
            </button>
          </div>
        </section>
        <section class="panel stack" aria-labelledby="history-heading">
          <div class="row">
            <h2 id="history-heading" data-i18n="history">历史记录</h2>
            <button data-action="history-clear" data-i18n="clearHistory">
              清空
            </button>
          </div>
          <ol id="history"></ol>
          <p id="history-empty" class="muted" data-i18n="emptyHistory">
            暂无记录
          </p>
          <button data-action="export" data-i18n="export">导出计算记录</button>
          <details>
            <summary data-i18n="reference">函数速查</summary>
            <p>
              <code
                >sin cos tan asin acos atan sinh cosh tanh sqrt cbrt abs ln log
                exp floor ceil round min max pow hypot clamp</code
              >
            </p>
            <p class="muted" data-i18n="constants">
              常量 pi、e、tau；变量 ans、mem、x。log(x) 为十进制对数，ln(x)
              为自然对数。科学计数示例 1.2e-3。
            </p>
          </details>
        </section>
      </div>
      <section class="panel graph-panel" aria-labelledby="graph-heading">
        <div class="row">
          <h2 id="graph-heading" data-i18n="graph">函数曲线</h2>
          <div class="graph-actions">
            <button id="fit" data-i18n="fit">适配 Y 轴</button
            ><button data-action="reset-plot" data-i18n="reset">重置坐标</button
            ><button class="primary" data-action="plot" data-i18n="plot">
              绘制曲线
            </button>
          </div>
        </div>
        <div class="graph-layout">
          <div>
            <div class="row graph-tools">
              <button id="zoom-in">+</button><button id="zoom-out">−</button
              ><small
                id="graph-status"
                class="muted"
                role="status"
                aria-live="polite"
              ></small>
              <span class="help">
                <button
                  class="help-trigger"
                  data-help-label="graphHelpLabel"
                  aria-describedby="graph-help"
                >
                  ?
                </button>
                <span
                  id="graph-help"
                  class="help-text"
                  role="tooltip"
                  data-i18n="graphHelp"
                ></span>
              </span>
            </div>
            <div class="canvas-wrap">
              <canvas
                id="graph"
                tabindex="0"
                role="img"
                aria-label="函数图像"
                aria-describedby="graph-help graph-summary"
              ></canvas>
            </div>
            <p id="graph-summary" class="sr-only"></p>
            <div
              id="coordinates"
              class="coordinates muted"
              aria-live="off"
            ></div>
            <div id="legend" class="legend"></div>
          </div>
          <div class="graph-controls stack">
            <label
              ><span data-i18n="functions">函数（每行一条，最多 3 条）</span
              ><textarea
                id="functions"
                rows="3"
                spellcheck="false"
                maxlength="4096"
              ></textarea>
            </label>
            <div class="ranges">
              <label
                ><span data-i18n="xmin">X 最小值</span
                ><input id="xmin" inputmode="decimal" maxlength="80" /></label
              ><label
                ><span data-i18n="xmax">X 最大值</span
                ><input id="xmax" inputmode="decimal" maxlength="80" /></label
              ><label
                ><span data-i18n="ymin">Y 最小值</span
                ><input id="ymin" inputmode="decimal" maxlength="80" /></label
              ><label
                ><span data-i18n="ymax">Y 最大值</span
                ><input id="ymax" inputmode="decimal" maxlength="80"
              /></label>
            </div>
            <div class="stack tools">
              <label
                ><span data-i18n="selectedCurve">数值分析曲线</span
                ><select id="curve">
                  <option value="0">f₁</option>
                  <option value="1">f₂</option>
                  <option value="2">f₃</option>
                </select></label
              >
              <div class="ranges">
                <label>a<input id="a" inputmode="decimal" /></label
                ><label>b<input id="b" inputmode="decimal" /></label>
              </div>
              <div class="row analysis-actions">
                <button data-action="root" data-i18n="root">区间求根</button
                ><button data-action="integrate" data-i18n="integrate">
                  定积分
                </button>
                <span class="help">
                  <button
                    class="help-trigger"
                    data-help-label="analysisHelp"
                    aria-describedby="analysis-hint"
                  >
                    ?
                  </button>
                  <span
                    id="analysis-hint"
                    class="help-text"
                    role="tooltip"
                    data-i18n="analysisHint"
                  ></span>
                </span>
              </div>
            </div>
          </div>
        </div>
      </section>
      <div class="footer">
        <p id="error" class="sr-only" role="alert"></p>
        <div id="artifacts" class="row"></div>
      </div>
    </main>
    <script>
      (() => {
        "use strict";
        const $ = (id) => document.getElementById(id);
        const ids = [
          "expression",
          "angle",
          "functions",
          "xmin",
          "xmax",
          "ymin",
          "ymax",
          "a",
          "b",
          "curve",
        ];
        const words = {
          title: ["科学计算器", "Scientific calculator"],
          save: ["保存工作区", "Save workspace"],
          load: ["载入", "Load"],
          calculate: ["计算", "Calculate"],
          angle: ["角度制", "Angle mode"],
          expression: ["表达式", "Expression"],
          syntax: [
            "Enter 计算 · 乘法请写 * · 上次答案 ans",

          history: ["历史记录", "History"],

          emptyHistory: ["暂无记录", "No history yet"],

          analysisHelp: ["数值分析说明", "Numerical analysis help"],
          selectedCurve: ["数值分析曲线", "Analysis curve"],
          root: ["区间求根", "Find root"],
          integrate: ["定积分", "Integrate"],
          analysisHint: [

          ],

          ],
          checkpointFailed: [
            "无法保留草稿，请先保存重要输入。",
            "Could not retain the draft. Save important input before leaving.",
          ],
        };
        Object.assign(words, {
          loadTitle: ["载入保存的工作区？", "Load the saved workspace?"],
          loadConfirm: [
            "载入会替换当前输入、记忆和历史，请先导出需要保留的记录。",
            "Loading replaces your current input, memory and history. Export anything you want to keep first.",
          ],
          cancel: ["取消", "Cancel"],
          confirmLoad: ["确认载入", "Load workspace"],
          xmin: ["X 最小值", "X minimum"],
          xmax: ["X 最大值", "X maximum"],
          ymin: ["Y 最小值", "Y minimum"],
          ymax: ["Y 最大值", "Y maximum"],
          zoomIn: ["放大 +", "Zoom in +"],
          zoomOut: ["缩小 −", "Zoom out −"],
          resampling: ["正在重新采样…", "Resampling…"],
          samplePreview: [
            "坐标预览；停止操作后重新采样",
            "Viewport preview; resampling after interaction",
          ],
          noStorage: [
            "未授权私有存储：计算、绘图和导出仍可使用；保存或载入工作区需在扩展中心授权。",

            d = dimensions(),
            tx = point ? (point.x - d.left) / (d.w - d.left - d.right) : 0.5,
            ty = point ? (point.y - d.top) / (d.h - d.top - d.bottom) : 0.5;
          const x = r.xmin + tx * (r.xmax - r.xmin),
            y = r.ymax - ty * (r.ymax - r.ymin),
            dx = (r.xmax - r.xmin) * factor,
            dy = (r.ymax - r.ymin) * factor;
          return setRange({
            xmin: x - tx * dx,
            xmax: x + (1 - tx) * dx,
            ymin: y - (1 - ty) * dy,
            ymax: y + ty * dy,
          });
        }
        function resampleSoon() {
          clearTimeout(zoomTimer);
          zoomTimer = setTimeout(() => void act("plot"), 280);
        }
        canvas.addEventListener(
          "wheel",
          (event) => {
            if (busy() || event.deltaY === 0) return;
            event.preventDefault();
            if (
              zoom(
                Math.exp(Math.max(-1, Math.min(1, event.deltaY / 100)) * 0.18),
                location(event),
              )
            )
              resampleSoon();
          },
          { passive: false },
        );
        canvas.onpointerdown = (event) => {
          if (busy() || event.button !== 0 || !event.isPrimary) return;
          event.preventDefault();
          canvas.focus();
          pointer = {
            ...location(event),
            range: { ...(viewport ?? range()) },
            id: event.pointerId,
          };
          canvas.setPointerCapture(event.pointerId);
        };
        canvas.onpointermove = (event) => {
          const point = location(event),
            d = dimensions();
          cursor = point;
          if (pointer && pointer.id === event.pointerId && !busy()) {
            const r = pointer.range,
              dx =
                ((point.x - pointer.x) / (d.w - d.left - d.right)) *
                (r.xmax - r.xmin),
              dy =
                ((point.y - pointer.y) / (d.h - d.top - d.bottom)) *
                (r.ymax - r.ymin);
            setRange({
              xmin: r.xmin - dx,
              xmax: r.xmax - dx,
              ymin: r.ymin + dy,
              ymax: r.ymax + dy,
            });
          }
          const r = viewport ?? range(),
            x =
              r.xmin +
              ((point.x - d.left) / (d.w - d.left - d.right)) *
                (r.xmax - r.xmin),
            y =
              r.ymax -
              ((point.y - d.top) / (d.h - d.top - d.bottom)) *
                (r.ymax - r.ymin);
          $("coordinates").textContent = `x ≈ ${fmt(x, 7)}   y ≈ ${fmt(y, 7)}`;
          scheduleDraw();
        };
        const endPan = (event) => {
          if (!pointer || pointer.id !== event.pointerId) return;
          pointer = null;
          if (canvas.hasPointerCapture(event.pointerId))
            canvas.releasePointerCapture(event.pointerId);
          resampleSoon();
        };
        canvas.onpointerup = endPan;
        canvas.onpointercancel = endPan;
        canvas.onlostpointercapture = endPan;
        canvas.onpointerleave = () => {
          if (!pointer) {
            cursor = null;
            $("coordinates").textContent = "";
            scheduleDraw();
          }
        };
        canvas.onkeydown = (event) => {
          if (busy()) return;
          const r = viewport ?? range(),
            dx = (r.xmax - r.xmin) * 0.15,
            dy = (r.ymax - r.ymin) * 0.15;
          let handled = true;
          if (event.key === "ArrowLeft")
            setRange({ ...r, xmin: r.xmin - dx, xmax: r.xmax - dx });
          else if (event.key === "ArrowRight")
            setRange({ ...r, xmin: r.xmin + dx, xmax: r.xmax + dx });
          else if (event.key === "ArrowUp")
            setRange({ ...r, ymin: r.ymin + dy, ymax: r.ymax + dy });
          else if (event.key === "ArrowDown")
            setRange({ ...r, ymin: r.ymin - dy, ymax: r.ymax - dy });
          else if (["+", "="].includes(event.key)) zoom(0.8);
          else if (event.key === "-") zoom(1.25);
          else handled = false;
          if (handled) {
            event.preventDefault();
            resampleSoon();
          }
        };
        $("zoom-in").onclick = () => {
          if (!busy() && zoom(0.8)) resampleSoon();
        };
        $("zoom-out").onclick = () => {
          if (!busy() && zoom(1.25)) resampleSoon();
        };
        $("fit").onclick = () => {
          if (busy()) return;
          const r = viewport ?? range(),
            ys = (chartData?.series ?? []).flatMap((series) =>
              series.points
                .filter(
                  ([x, y]) =>
                    x >= r.xmin &&
                    x <= r.xmax &&
                    y !== null &&
                    Number.isFinite(y) &&
                    Math.abs(y) < 1e11,
                )
                .map(([, y]) => y),
            );
          if (!ys.length) {
            report(tr("noSamples"));
            return;
          }
          const low = Math.min(...ys),
            high = Math.max(...ys),
            margin = Math.max((high - low) * 0.1, 0.5);
          if (setRange({ ...r, ymin: low - margin, ymax: high + margin }))
            void act("plot");
        };
        const resize = new ResizeObserver(scheduleDraw);
        resize.observe(canvas.parentElement);
        function watchDpr() {
          const query = matchMedia(
            `(resolution: ${window.devicePixelRatio || 1}dppx)`,
          );
          query.addEventListener(
            "change",
            () => {
              scheduleDraw();
              watchDpr();
            },
            { once: true },
          );
        }
        watchDpr();
        window.addEventListener(
          "pagehide",
          () => {
            disposed = true;
            draftEpoch++;
            draftDeferred = false;
            conflictRetriedRevision = -1;
            awaitIdleSnapshot = false;
            clearTimeout(draftTimer);
            draftTimer = undefined;
            clearTimeout(zoomTimer);
            if (frame) cancelAnimationFrame(frame);
            resize.disconnect();
          },
          { once: true },
        );
        document.querySelectorAll("button").forEach((button) => {
          button.type = "button";
          if (!button.classList.contains("primary"))
            button.dataset.variant = "outline";
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            for (const help of document.querySelectorAll(".help"))
              if (
                help.matches(":hover") ||
                help.contains(document.activeElement)
              ) {
                help.dataset.dismissed = "true";
                event.preventDefault();
              }
          }
          if (event.key === "Escape" && !$("load-confirm").hidden) {
            event.preventDefault();
            $("load-cancel").click();
          }
        });
        document.querySelectorAll(".help").forEach((help) => {
          for (const name of ["pointerenter", "focusin"])
            help.addEventListener(name, () => delete help.dataset.dismissed);
          for (const name of ["pointerleave", "focusout"])
            help.addEventListener(name, () => {
              if (!help.contains(document.activeElement))
                delete help.dataset.dismissed;
            });
        });
        starter.onChange((snapshot) => {
          if (disposed) return;
          hostSnapshotSerial++;
          if (current?.busy && !snapshot.busy)
            completedBusySerial = hostSnapshotSerial;
          if (awaitIdleSnapshot && !snapshot.busy) awaitIdleSnapshot = false;
          const checkpointKey = JSON.stringify(snapshot.checkpoint ?? null);
          // Host session imports can replace a live document. Local input owns its
          // draft until that explicit checkpoint replacement or a completed action.
          if (
            hydrated &&
            !working &&
            checkpointKey !== lastCheckpoint &&
            !ownedCheckpoints.has(checkpointKey)
          ) {
            clearTimeout(draftTimer);
            draftTimer = undefined;
            draftEpoch++;
            draftDeferred = false;
            conflictRetriedRevision = -1;
            awaitIdleSnapshot = false;
            localDraft = false;
            hydrated = false;
          }
          lastCheckpoint = checkpointKey;
          current = snapshot;
          render();
        });
      })();
    </script>
  </body>
</html>
